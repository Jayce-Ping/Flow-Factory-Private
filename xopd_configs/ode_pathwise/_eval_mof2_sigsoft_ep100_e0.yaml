# AUTOGENERATED eval-only config: forced-expert readout of checkpoint-100 on the FULL
# geneval/ocr test sets (553 + 1017 prompts). The train split is t2is, a 150-prompt text-only
# stand-in that is never consumed and costs nothing to preprocess:
# the run is stopped once both eval sets are logged (epoch-0 eval precedes training).
launcher: accelerate
config_file: config/accelerate_configs/fsdp_hybrid_shard.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: bf16
data:
  dataset_dir: dataset/t2is
  dataset_dirs:
  - dataset/t2is
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: ~/.cache/flow_factory/datasets
  max_dataset_size: null
  sampler_type: auto
model:
  finetune_type: lora
  lora_rank: 64
  lora_alpha: 128
  target_modules: all-linear
  model_name_or_path: black-forest-labs/FLUX.2-klein-base-4B
  model_type: flux2-klein
  resume_path: /apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints/flux2klein_32b_to_4b_mof2_mix_fsdp_vmse_sigsoft_nolb_1kep/checkpoints/checkpoint-100
  resume_type: lora
  mof_enabled: true
  mof_num_experts: 2
  mof_top_k: 1
  mof_route_granularity: sample
  mof_router_type: global
  mof_router_input: prompt
  mof_noise_std: 0.0
  mof_dense_exec: true
  mof_soft_blend: true
  mof_gate_fn: sigmoid
  mof_topk_sparse: false
  mof_router_init: zero
  compile_teacher: true
  compile_student: true
  compile_mode: default
  mof_force_expert: 0
log:
  run_name: EVAL_mof2_sigsoft_ep100_e0
  project: Flow-Factory-XOPD
  logging_backend: wandb
  save_dir: /apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints
  save_freq: 0
  save_model_only: true
train:
  trainer_type: xopd
  fsdp_shard_teacher: false
  max_epochs: 1
  teacher_model_name_or_path: black-forest-labs/FLUX.2-dev
  teacher_param_device: cuda
  assume_shared_vae_text_encoder: true
  eval_teacher_at_start: false
  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0
  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: logit_normal
  l0_weighting: min_snr
  l0_snr_gamma: 5.0
  pathwise_coef: 1.0
  normalize_d_k: false
  kl_type: x-based
  kl_beta: 0.0
  xopd_dk_space: v
  moe_load_balance_coeff: 0.0
  source_ratio:
    t2is: 1
  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 64
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto
  learning_rate: 0.0001
  adam_weight_decay: 0.0001
  adam_betas:
  - 0.9
  - 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: cuda
  enable_gradient_checkpointing: false
  offload_samples_to_cpu: true
  seed: 42
scheduler:
  dynamics_type: ODE
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 1
  seed: 42
  test_sets:
  - name: geneval_gs1
    dataset_dir: dataset/geneval_enhanced
    split: test
    guidance_scale: 1.0
    eval_reward_names:
    - geneval
    - pick_score
  - name: ocr_gs1
    dataset_dir: dataset/ocr
    split: test
    guidance_scale: 1.0
    eval_reward_names:
    - ocr
    - pick_score
rewards:
- name: geneval
  reward_model: geneval
  weight: 1
  batch_size: 64
  device: cuda
  dtype: float32
  async_reward: false
- name: pick_score
  reward_model: PickScore
  batch_size: 64
  device: cuda
  dtype: bfloat16
  async_reward: false
- name: ocr
  reward_model: ocr
  batch_size: 64
  device: cpu
  dtype: float32
  async_reward: false
