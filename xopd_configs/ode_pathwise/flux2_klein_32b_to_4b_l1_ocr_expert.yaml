# Cross-OPD (XOPD): FLUX.2-dev (teacher) -> FLUX.2-klein-base-4B (student)
# OCR EXPERT for the MoE merge ablation. Same as *_ocr_full (full-FT, OCR-only) EXCEPT
# target_modules is restricted to the DOUBLE-stream MLP (ff/ff_context), so the merge is
# lossless MLP-only and every ablation variant (A/B/C) shares the SAME base backbone.
#
# Why double-stream MLP ONLY: klein fuses single-block QKV+MLP-in into ONE Linear
# (attn.to_qkv_mlp_proj) and attn-out+MLP-out into ONE Linear (attn.to_out). target_modules
# matches whole tensors, so the single-stream MLP CANNOT be isolated from single-stream
# attention by any string. Training it would drift single-stream attention. We therefore
# train only the clean double-stream ff/ff_context; single-stream MLP stays == base across
# all experts at init and is re-specialized during the MoE mix-train (assert_mlp_only=true).
#
# save_freq>0: this run's checkpoint is consumed by the merge configs (moe_expert_paths).

# ===== Environment =====
launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

# ===== Data (OCR prompts only) =====
data:
  dataset_dir: "dataset/geneval"
  dataset_dirs:
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null
  sampler_type: "auto"

# ===== Model (student = OCR expert, full-FT restricted to MoE-able MLP layers) =====
model:
  finetune_type: "full"                   # full-FT, restricted to the double-stream MLP (clean, losslessly mergeable)
  target_modules:                         # DOUBLE-stream MLP ONLY -- ff/ff_context are clean separate modules.
    - "ff.linear_in"                      # (single-stream MLP is fused with QKV/attn-out in one tensor each and
    - "ff.linear_out"                     #  CANNOT be isolated by substrings, so it stays == base and is
    - "ff_context.linear_in"              #  re-specialized during the MoE mix-train.)
    - "ff_context.linear_out"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null

# ===== Logging =====
log:
  run_name: "flux2klein_32b_to_4b_l1_ocr_expert"   # OCR expert (MLP-able) for MoE merge
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 50                           # SAVE: this expert is consumed by the merge configs
  save_model_only: true

# ===== Training (XOPD) =====
train:
  trainer_type: "xopd"
  max_epochs: 500

  teacher_model_name_or_path: "black-forest-labs/FLUX.2-dev"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true
  eval_teacher_at_start: false

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  pathwise_coef: 1.0
  reinforce_coef: 0.0
  reinforce_horizon: null
  reinforce_future_reduction: "mean"
  normalize_d_k: false
  kl_type: "x-based"
  kl_beta: 0.0

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 64         # = single-source baseline; num_batches_per_epoch = 2
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-5                   # full-FT stability (matches *_ocr_full)
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"

  enable_gradient_checkpointing: true
  offload_samples_to_cpu: false
  seed: 42

# ===== Scheduler =====
scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

# ===== Evaluation (shared across the ablation) =====
eval:
  resolution: 1024
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 20
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval,   split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}
    - {name: ocr_gs4,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 4.0, eval_reward_names: [ocr, pick_score]}
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore, split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}

# ===== Rewards (logging only; not part of the XOPD loss) =====
rewards:
  - {name: "geneval", reward_model: "geneval", weight: 1, batch_size: 64, device: "cuda", dtype: float32, async_reward: false}
  - {name: "pick_score", reward_model: "PickScore", batch_size: 64, device: "cuda", dtype: bfloat16, async_reward: false}
  - {name: "ocr", reward_model: "ocr", batch_size: 64, device: "cpu", dtype: float32, async_reward: false}
