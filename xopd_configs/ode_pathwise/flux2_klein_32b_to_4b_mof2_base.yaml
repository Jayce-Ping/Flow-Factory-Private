# Cross-OPD (XOPD): FLUX.2-dev (teacher) -> 2-expert VELOCITY-space MoF student (MoF2 ablation).
# 2 INDEPENDENT full FLUX.2-klein-base-4B experts (LoRA copies of base); a shared per-SAMPLE
# global router picks top-1 expert/sample and (at top_k=1) uses its velocity directly; distilled
# to dev-32B (L1 + load-balance aux). This is the EFFICIENT MoF path: per-sample top-1 runs ONLY
# 1 of the 2 full-transformer experts each step (~1x student forward), unlike the per-token MoF8
# which runs all N. Analogue of MoE2 (both top-1 of 2), but MoF blends whole-sample velocities.
#
# SCALE / MEMORY: 2x4B experts (~13GB, replicated) + 32B teacher (64GB, replicated) ~85GB fits 96G
# on plain DDP. DDP (not FSDP) is what makes per-sample top-k cheap AND safe: only k experts run,
# and replicated params need no conditional FSDP all-gather (which would hang across ranks that
# pick different experts). LoRA (rank 64, 'all-linear') keeps trainable/optimizer tiny.

# ===== Environment =====
launcher: "accelerate"
config_file: config/accelerate_configs/multi_gpu.yaml   # plain DDP (replicate): 2x4B experts (~13GB) + teacher(32B,64GB) ~85GB fits 96G. DDP (not FSDP) is REQUIRED so per-sample top-k can run only k experts without an FSDP conditional-all-gather hang. Launch via run_4node_ddp.sh.
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

# ===== Data (OCR-only) =====
data:
  dataset_dir: "dataset/geneval"
  dataset_dirs:
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null
  sampler_type: "auto"

# ===== Model (8-expert velocity MoF; copy-8 from base; per-token top-2; LoRA rank 64 / all-linear) =====
model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "all-linear"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null
  # --- MoF-V construction (efficient: per-SAMPLE top-1 -> only 1 of 2 full-transformer experts runs/sample) ---
  mof_enabled: true
  mof_num_experts: 2
  mof_top_k: 1
  mof_route_granularity: "sample"         # per-sample routing: run ONLY the top-1 expert each sample (at bsz=1 -> exactly 1 forward). This is the MoF activation/compute reduction.
  mof_router_type: "global"               # per-sample gate on pooled prompt + timestep (sample granularity)
  mof_noise_std: 0.0                      # LoRA gaussian init breaks expert symmetry

# ===== Logging =====
log:
  run_name: "flux2klein_32b_to_4b_mof2_base"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "/apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints"
  save_freq: 50
  save_model_only: true

# ===== Training (XOPD distill to dev-32B, OCR-only) =====
train:
  trainer_type: "xopd"
  fsdp_shard_teacher: false               # DDP: teacher (32B) + both experts replicated per GPU; per-sample top-1 runs 1 expert (find_unused_parameters handles the unrun expert's grad)
  max_epochs: 500

  teacher_model_name_or_path: "black-forest-labs/FLUX.2-dev"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true
  eval_teacher_at_start: false

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  pathwise_coef: 1.0
  reinforce_coef: 0.0
  reinforce_horizon: null
  reinforce_future_reduction: "mean"
  normalize_d_k: false
  kl_type: "x-based"
  kl_beta: 0.0

  moe_load_balance_coeff: 0.01            # reused for the MoF router load-balance aux
  source_ratio: {ocr: 1}

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 64
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: "cuda"

  enable_gradient_checkpointing: true     # DDP has no FSDP-side AC -> model-side gradient checkpointing on the (1 active) expert
  offload_samples_to_cpu: false
  seed: 42

# ===== Scheduler =====
scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

# ===== Evaluation (eval @ 512 on all 3 domains) =====
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 40
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval,   split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}
    - {name: ocr_gs4,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 4.0, eval_reward_names: [ocr, pick_score]}
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore, split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}

# ===== Rewards (logging only; not part of the XOPD loss) =====
rewards:
  - {name: "geneval", reward_model: "geneval", weight: 1, batch_size: 64, device: "cuda", dtype: float32, async_reward: false}
  - {name: "pick_score", reward_model: "PickScore", batch_size: 64, device: "cuda", dtype: bfloat16, async_reward: false}
  - {name: "ocr", reward_model: "ocr", batch_size: 64, device: "cpu", dtype: float32, async_reward: false}
