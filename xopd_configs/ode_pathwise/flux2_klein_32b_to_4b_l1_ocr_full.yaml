# Cross-OPD (XOPD): FLUX.2-dev (teacher) -> FLUX.2-klein-base-4B (student)
# FULL-FINETUNE single-domain OCR: 4B student full-FT (not LoRA) distilled from the
# 32B teacher, trained on OCR prompts only. Tests whether full-FT breaks the OCR
# capacity ceiling that LoRA single-ocr hit (~0.61/0.68 vs teacher 0.82).
# Cross-FAMILY distillation: teacher and student share the VAE / latent space
# (AutoencoderKLFlux2, in_channels=128) but use DIFFERENT text encoders -- dev's
# Mistral3 (dim 15360) vs klein's Qwen3 (dim 7680). Teacher text embeddings are
# precomputed during preprocessing and the 48GB teacher text encoder is offloaded
# before training; the 64GB teacher transformer stays resident.
# Non-CFG (teacher_gs = student_gs = 1.0); pure L1 (l0_warmup_epochs=0).
# Teacher-baseline eval SKIPPED (eval_teacher_at_start: false) — teacher performance
# is already known from prior runs (uilxegpn/j133yiuk); the shared teacher ceiling
# is overlaid in the comparison HTML from those runs. Teacher transformer still
# loads for L1 supervision.

# ===== Environment =====
launcher: "accelerate"                    # Launcher. Options: accelerate
config_file: config/deepspeed/deepspeed_zero2.yaml  # Distributed config; use zero3 if VRAM-limited (64GB teacher + 4B full-FT student)
num_processes: 8                          # Number of processes (GPUs); overrides the config file
main_process_port: 29500                  # Master process port
mixed_precision: "bf16"                   # Mixed precision. Options: no, fp16, bf16

# ===== Data (prompts only; L0's z0 is teacher-generated) =====
data:
  dataset_dir: "dataset/geneval"          # Eval/test fallback (test split is read from here when eval.test_sets omits a dataset_dir).
  # --- Training prompt set: OCR only ---
  dataset_dirs:
    - "dataset/ocr"
  preprocessing_batch_size: 32            # Batch size for offline teacher text encoding
  dataloader_num_workers: 16              # DataLoader worker processes
  force_reprocess: false                  # true: ignore cache and re-preprocess
  cache_dir: "~/.cache/flow_factory/datasets"  # Preprocess cache directory (same as mix/LoRA-ocr runs -> ocr cache HIT)
  max_dataset_size: null                  # Truncate dataset size; null = no limit
  sampler_type: "auto"                    # Sampler. Options: auto, distributed_k_repeat, group_contiguous

# ===== Model (student = the small model being trained, FULL finetune) =====
model:
  finetune_type: "full"                   # FULL finetune (vs LoRA) — tests if full-FT breaks the OCR ceiling
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"  # Student path (HF repo id or local)
  model_type: "flux2-klein"               # Adapter registry key (fixed for klein)
  resume_path: null                       # Checkpoint/LoRA to resume from; null = none
  resume_type: null                       # Options: lora, full, state; null = auto by finetune_type

# ===== Logging =====
log:
  run_name: "flux2klein_32b_to_4b_baseline_l0w0_ocr_full"  # Full-FT single-ocr
  project: "Flow-Factory-XOPD"            # Logger project name
  logging_backend: "wandb"                # Options: wandb, swanlab, tensorboard, none
  save_dir: "saves/"                      # Checkpoint / log directory
  save_freq: 0                            # Save every N epochs (0 disables)
  save_model_only: true                   # Save only model weights (not optimizer/scheduler state)

# ===== Training (XOPD) =====
train:
  trainer_type: "xopd"                    # Selects the Cross-OPD trainer (fixed)
  max_epochs: 500                         # Match the LoRA single-ocr for comparability

  # --- Cross-model teacher ---
  teacher_model_name_or_path: "black-forest-labs/FLUX.2-dev"  # Teacher path; only its transformer (~64GB) is loaded. VAE reused from student; teacher text encoder (Mistral3) is precomputed offline then offloaded
  teacher_param_device: "cuda"            # Teacher transformer device. Options: cuda (only cuda supported today), cpu
  assume_shared_vae_text_encoder: true    # FLUX.2-dev shares the VAE / latent space with klein (in_channels=128); its text encoder differs and is encoded separately. false raises.

  # --- Teacher baseline eval: SKIPPED (reuse prior runs' teacher performance) ---
  eval_teacher_at_start: false            # Skip the ~2h teacher-baseline eval at epoch 0; teacher transformer still loads for L1. Teacher ceiling overlaid in the comparison HTML from uilxegpn/j133yiuk.

  # --- Dual classifier-free guidance (teacher / student independent) ---
  teacher_guidance_scale: 1.0             # Teacher CFG. >1 runs cond+uncond passes (needs negatives); raise to distill guidance
  student_guidance_scale: 1.0             # Student CFG for forward + rollout; synced into base guidance_scale

  # --- L0: velocity-regression warmup (teacher-generated data) ---
  l0_warmup_epochs: 0                     # Run L0 for the first N epochs, then switch to L1 (0 disables L0)
  l0_num_inference_steps: 50              # Teacher rollout steps when generating z0 targets in L0
  l0_inner_steps: 4                       # Random-t regression sub-steps per generated z0 batch; MUST be a multiple of num_train_timesteps (else auto-rounded up + warned). L0 runs l0_inner_steps/num_train_timesteps optimizer steps/epoch; each z0 reused l0_inner_steps times.
  l0_time_sampling: "logit_normal"        # L0 t sampling. Options: logit_normal, uniform
  l0_weighting: "min_snr"                 # L0 loss weight w(t). Options: min_snr, snr, uniform
  l0_snr_gamma: 5.0                       # Min-SNR-gamma clamp (used when l0_weighting=min_snr)

  # --- L1: on-policy transition matching ---
  pathwise_coef: 1.0                      # Coefficient on per-step Gaussian KL D_k (mean matching); >= 0
  reinforce_coef: 0.0                     # REINFORCE trajectory-term coefficient; 0 disables (pure pathwise)
  reinforce_horizon: null                 # Future steps aggregated into R_bar; null = all j > k
  reinforce_future_reduction: "mean"      # R_bar aggregation. Options: sum, mean
  normalize_d_k: false                    # true: divide D_k by 2*sigma_bar^2; false: plain MSE
  kl_type: "x-based"                      # KL anchor type vs base. Options: x-based, v-based
  kl_beta: 0.0                            # KL anchor coefficient; 0 disables

  # --- Sampling / batch ---
  resolution: 512                         # Generation resolution (int or [H, W]); klein native is 1024, lower to save memory
  num_inference_steps: 28                 # L1 student rollout steps (undistilled base models need more steps)
  per_device_batch_size: 1                # Conservative: 32B teacher ~64GB resident + 4B full-FT student. Re-run a batch search once GPUs are free to raise it.
  group_size: 1                           # Group size (XOPD default 1; only >1 if you add grouped REINFORCE)
  unique_sample_num_per_epoch: 64         # Unique prompts sampled per epoch (= LoRA single-ocr; matched comparison). num_batches_per_epoch = 64/32 = 2.
  gradient_step_per_epoch: 1              # MUST be 1 for XOPD: L1 does exactly one on-policy optimizer step/epoch (auto GAS = num_batches_per_epoch * num_train_timesteps = 2*28 = 56)
  num_inner_epochs: 1                     # MUST be 1 for XOPD (no rollout reuse); enforced at startup
  gradient_accumulation_steps: auto       # Options: auto (recommended), or exactly num_batches_per_epoch * num_train_timesteps

  # --- Optimizer ---
  learning_rate: 1.0e-5                   # Learning rate (lower than LoRA's 1e-4: full-FT moves all 4B params, keep it stable)
  adam_weight_decay: 1.0e-4               # AdamW weight decay
  adam_betas: [0.9, 0.999]               # AdamW betas
  adam_epsilon: 1.0e-8                   # AdamW epsilon
  max_grad_norm: 1.0                      # Gradient-norm clip threshold

  # --- EMA ---
  ema_decay: 0.9                          # EMA decay (0 disables)
  ema_update_interval: 4                  # EMA update interval (epochs)
  ema_device: "cuda"                      # EMA storage device. Options: cpu, cuda

  # --- Memory / misc ---
  enable_gradient_checkpointing: true     # On (safe default for full-FT): 4B full-FT student + 64GB teacher; ~77GB/GPU with ZeRO-2, fits 98GB. Flip to false for speed once no-OOM confirmed.
  offload_samples_to_cpu: false           # Offload sample tensors to CPU between sample() and optimize() to cut peak VRAM
  seed: 42                                # Random seed

# ===== Scheduler =====
scheduler:
  dynamics_type: "ODE"                    # Dynamics. Options: Flow-SDE, Dance-SDE, CPS, ODE (REINFORCE only meaningful under SDE)
  noise_level: 0.0                        # SDE noise level a
  num_sde_steps: null                     # Number of noise-injection steps per training step
  sde_steps: null                         # Candidate noise window (randomly chosen during training); null = auto
  seed: 42                                # Scheduler seed

# ===== Evaluation (identical across the ablation so all runs are comparable) =====
eval:
  resolution: 1024                        # Eval resolution
  per_device_batch_size: 1                # Eval batch size
  num_inference_steps: 40                 # Eval steps
  guidance_scale: 1.0                     # Eval CFG (global default; overridden per test_set)
  eval_freq: 20                           # Eval every N epochs (0 disables)
  seed: 42                                # Eval seed
  test_sets:                              # geneval / ocr / pickscore, each at gs=1.0 (no CFG) and gs=4.0 (CFG).
    - {name: geneval_gs1,   dataset_dir: dataset/geneval,   split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}   # + PickScore (general preference, runs on any prompt/image)
    - {name: geneval_gs4,   dataset_dir: dataset/geneval,   split: test, guidance_scale: 4.0, eval_reward_names: [geneval, pick_score]}   # + PickScore (general preference, runs on any prompt/image)
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}   # OCR (isolated env) + PickScore
    - {name: ocr_gs4,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 4.0, eval_reward_names: [ocr, pick_score]}   # OCR (isolated env) + PickScore
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore, split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}
    - {name: pickscore_gs4, dataset_dir: dataset/pickscore, split: test, guidance_scale: 4.0, eval_reward_names: [pick_score]}

# ===== Rewards (optional for XOPD; logging only, NOT part of the distillation loss) =====
rewards:
  - name: "geneval"                       # Reward name (referenced by eval_reward_names: [geneval])
    reward_model: "geneval"               # Reward model type (matches dataset/geneval)
    weight: 1                             # Weight (for multi-reward aggregation)
    batch_size: 64                        # Reward inference batch size
    device: "cuda"                        # Device
    dtype: float32                        # GenEval forces fp32 internally (autocast off + model.float()); this is a placeholder
    async_reward: false                   # Compute reward synchronously
  - name: "pick_score"                    # Referenced by eval_reward_names: [pick_score]
    reward_model: "PickScore"
    batch_size: 64
    device: "cuda"
    dtype: bfloat16
    async_reward: false
  # OCR reward runs OUT-OF-PROCESS in the isolated `ocr` conda env (paddleocr 2.9.1,
  # numpy<2) spawned by rewards/ocr.py, so ff's numpy2/torch stack stays untouched.
  # The PaddleOCR worker is CPU-only; override its interpreter via env OCR_ENV_PYTHON
  # (default /opt/conda/envs/ocr/bin/python).
  - name: "ocr"
    reward_model: "ocr"
    batch_size: 64
    device: "cpu"          # inert: the PaddleOCR worker always runs on CPU
    dtype: float32
    async_reward: false
