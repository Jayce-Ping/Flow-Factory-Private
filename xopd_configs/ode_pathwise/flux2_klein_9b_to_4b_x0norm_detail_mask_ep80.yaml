# 9B -> 4B validation of offline-calibrated harmful-detail masking.
# Matched to the dense 28-step Geneval ODE audit, except the required OPD loss is
# MSE(x0_norm) and each sample-step is retained only when
# RMS(v9-v4) * relu(-cos(grad(x0_4), grad(x0_9-x0_4))) <= its calibrated threshold.

launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/geneval"
  dataset_dirs: null
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null
  sampler_type: "group_contiguous"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "/apdcephfs_fsgm3/share_305110755/hunyuan/public_models/black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null

log:
  run_name: "flux2klein_9b_to_4b_x0norm_detailmask_ep80_20260802"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "/apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints"
  save_freq: 20
  save_model_only: true

train:
  trainer_type: "xopd"
  max_epochs: 81
  teacher_model_name_or_path: "/apdcephfs_fsgm3/share_305110755/hunyuan/public_models/black-forest-labs/FLUX.2-klein-base-9B"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true
  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0
  eval_teacher_at_start: true

  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  pathwise_coef: 1.0
  normalize_d_k: false
  xopd_dk_space: "x0_norm"
  kl_type: "x-based"
  kl_beta: 0.0
  xopd_target_mode: "direct"

  xopd_detail_mask_enabled: true
  xopd_detail_mask_threshold: 0.027123659585181516
  xopd_detail_mask_step_thresholds:
    - 0.137287530727
    - 0.100919838620
    - 0.090378246817
    - 0.027123659585
    - 0.027123659585
    - 0.045394848247
    - 0.053332790929
    - 0.027123659585
    - 0.027123659585
    - 0.031777938149
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.028070023214
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585
    - 0.027123659585

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 4
  group_size: 1
  unique_sample_num_per_epoch: 128
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"
  enable_gradient_checkpointing: false
  offload_samples_to_cpu: false
  seed: 42

scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: 0
  sde_steps: []
  seed: 42

eval:
  resolution: 1024
  per_device_batch_size: 1
  num_inference_steps: 28
  guidance_scale: 1.0
  eval_freq: 20
  seed: 42
  test_sets:
    - {name: geneval_gs1, dataset_dir: dataset/geneval, split: test, guidance_scale: 1.0, eval_reward_names: [geneval]}
    - {name: geneval_gs4, dataset_dir: dataset/geneval, split: test, guidance_scale: 4.0, eval_reward_names: [geneval]}

rewards:
  - name: "geneval"
    reward_model: "geneval"
    weight: 1
    batch_size: 64
    device: "cuda"
    dtype: float32
    async_reward: false
