# Cross-OPD A4 + PDM smoke: both CFG branches are supervised at rollout GS=1.

launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/geneval"
  dataset_dirs:
    - "dataset/geneval"
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null
  sampler_type: "auto"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null

log:
  run_name: "TEST_9b_4b_marginal_cfm_pdm_smoke"
  project: "Flow-Factory-XOPD"
  logging_backend: "none"
  save_dir: "saves/"
  save_freq: 0
  save_model_only: true

train:
  trainer_type: "xopd"
  max_epochs: 1
  eval_teacher_at_start: false

  teacher_model_name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true
  vae_transport: "identity"

  # These scales choose the source trajectories only. PDM still forces and
  # supervises both positive and negative branches at every selected state.
  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0
  xopd_cfg_objective: "pdm"
  xopd_pdm_lambda: 1.0

  l0_warmup_epochs: 0
  l0_num_inference_steps: 28
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  pathwise_coef: 1.0
  normalize_d_k: false
  xopd_dk_space: "v"
  kl_type: "x-based"
  kl_beta: 0.0
  xopd_target_mode: "marginal_cfm"
  marginal_cfm_alpha: 0.5

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 4
  group_size: 1
  unique_sample_num_per_epoch: 32
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"
  enable_gradient_checkpointing: false
  offload_samples_to_cpu: false
  seed: 42

scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 28
  guidance_scale: 1.0
  eval_freq: 0
  seed: 42
  test_sets: []

rewards: []
