# Cross-OPD (XOPD): FLUX.2-dev (teacher) -> 8-expert VELOCITY-space MoF student (Experiment 4).
# 8 INDEPENDENT full FLUX.2-klein-base-4B experts (LoRA-adapted copies of base); one shared
# per-token router picks top-2 experts/token (softmax + renorm) and blends their OUTPUT
# velocities; distilled to dev-32B (L1 + load-balance aux). Contrast with Experiment 3
# (weight-space MoE): there top-k gives sparse MLP compute; here per-token routing runs ALL 8
# expert forwards each step (top-k only sparsifies the blend) -> ~8x student forward.
#
# SCALE / MEMORY: 8x4B experts (frozen base) + 32B teacher (~96B) -> FSDP2 full-shard of both
# (fsdp_shard_teacher + fsdp2_prefetch.yaml). LoRA (rank 64, 'all-linear') keeps trainable/optimizer
# tiny. A single-node (8-GPU) feasibility test decides whether offload is needed (token-EP does
# NOT apply to full-model experts).

# ===== Environment =====
launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml  # ZeRO-2 (proven 4-node multi-node); teacher(64GB) replicated per GPU; ZeRO-2 shards student optim/grad.
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

# ===== Data (OCR-only) =====
data:
  dataset_dir: "dataset/geneval"
  dataset_dirs:
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null
  sampler_type: "auto"

# ===== Model (8-expert velocity MoF; copy-8 from base; per-token top-2; LoRA rank 64 / all-linear) =====
model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "all-linear"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null
  # --- MoF-V construction ---
  mof_enabled: true
  mof_num_experts: 8
  mof_top_k: 2
  mof_route_granularity: "token"          # per-token routing (runs all 8 experts; top-k sparsifies the blend)
  mof_router_type: "token_linear"         # one shared per-token gate on input latent + timestep
  mof_noise_std: 0.0                      # LoRA gaussian init breaks expert symmetry

# ===== Logging =====
log:
  run_name: "flux2klein_32b_to_4b_mof8_base"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "/apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints"
  save_freq: 50
  save_model_only: true

# ===== Training (XOPD distill to dev-32B, OCR-only) =====
train:
  trainer_type: "xopd"
  fsdp_shard_teacher: false               # shard ONLY the 8x4B (~32B) MoF student via FSDP2; teacher (32B) replicated per GPU -> no per-step teacher all-gather. NOTE: route_granularity='token' runs all 8 experts (uniform across ranks -> FSDP-safe) but ~8x forward; the efficient per-sample top-k needs EP-for-MoF (see mof2 for the DDP top-k path).
  max_epochs: 500

  teacher_model_name_or_path: "black-forest-labs/FLUX.2-dev"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true
  eval_teacher_at_start: false

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  pathwise_coef: 1.0
  reinforce_coef: 0.0
  reinforce_horizon: null
  reinforce_future_reduction: "mean"
  normalize_d_k: false
  kl_type: "x-based"
  kl_beta: 0.0

  moe_load_balance_coeff: 0.01            # reused for the MoF router load-balance aux
  source_ratio: {ocr: 1}

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 64
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: "cuda"

  enable_gradient_checkpointing: false    # FSDP activation checkpointing handles AC (avoid double-AC)
  offload_samples_to_cpu: false
  seed: 42

# ===== Scheduler =====
scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

# ===== Evaluation (eval @ 512 on all 3 domains) =====
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 40
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval,   split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}
    - {name: ocr_gs4,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 4.0, eval_reward_names: [ocr, pick_score]}
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore, split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}

# ===== Rewards (logging only; not part of the XOPD loss) =====
rewards:
  - {name: "geneval", reward_model: "geneval", weight: 1, batch_size: 64, device: "cuda", dtype: float32, async_reward: false}
  - {name: "pick_score", reward_model: "PickScore", batch_size: 64, device: "cuda", dtype: bfloat16, async_reward: false}
  - {name: "ocr", reward_model: "ocr", batch_size: 64, device: "cpu", dtype: float32, async_reward: false}
