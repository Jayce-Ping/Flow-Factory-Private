# Cross-OPD (XOPD): FLUX.2-dev (teacher) -> 2-expert VELOCITY-space MoF student, FSDP HYBRID_SHARD,
# MIXED geneval_enhanced + ocr training. NON-CONVEX DENSE SOFT MIXING: independent sigmoid gates
# blended over ALL experts, out = sum_e sigma(l_e) * v_e, with no load balance.
#
# Why this arm: the sigmoid + top-1 SPARSE arm (..._sigtopk_1kep) was single-expert from step 0 --
# with random head init the two logits differ by a near-constant offset (+0.441 vs +-0.024 across
# prompts), so top-1 picked the same expert for every prompt and the other never saw a sample.
# Dense blending removes that failure mode by construction: every expert is weighted on every
# sample, so both receive gradient no matter what the router does, and the router head trains from
# the main loss because the blend is differentiable.
#
# Deltas vs ..._soft_nolb_1kep (its softmax twin): mof_gate_fn softmax -> sigmoid. Gates are then
# INDEPENDENT and do NOT sum to 1, so the blended velocity magnitude is free rather than a convex
# combination -- regularized by MSE(v) alone (mof_weight_sum_penalty_coeff stays 0). At init both
# gates are 0.5 and the two experts are identical, so the student still starts exactly at the base
# flow model (0.5v + 0.5v = v); this is what the sparse arm could not do, since a single 0.5 gate
# there halved the velocity and wrecked step-0 sampling.
#
# The router input is prompt + timestep (router_input "prompt" already concatenates the timestep
# embedding; the "fused_*" modes are the ones that additionally read the latent x_t).
# (distinct 2x4B, zero-init router, full-timestep MSE(v), compile on.)
# ---- original mof2_mix header ----
# Variant of flux2_klein_32b_to_4b_mof2_base.yaml that SHARDS
# the 8B student (2x4B experts + global router) across GPUs so the 2 full experts + the replicated 32B
# teacher + full-trajectory activations fit on 96G H20. Deltas vs the DDP mof2_base:
#   1. config_file -> FSDP HYBRID_SHARD (shard the student INTRA-node over 8 GPUs, REPLICATE across
#      nodes). Only the accelerator.prepare'd student is sharded.
#   2. Teacher stays ONE-per-GPU (fsdp_shard_teacher: false -> loaded separately, NOT prepared, so
#      NOT sharded). This is the "teacher replicated, student sharded" split the user asked for.
#   3. mof_dense_exec + mof_soft_blend: true -- REQUIRED under FSDP. per-sample top-1 routing normally
#      runs only the routed expert per rank; with sharded experts that issues DIVERGENT all-gathers
#      across ranks -> NCCL DEADLOCK. Both flags run EVERY expert on ALL samples (uniform all-gather).
#      soft_blend blends by the FULL softmax (out = sum_e P_e * v_e) instead of a hard top-1 one-hot:
#      the argmax is non-differentiable, so hard top-1 gave the router head ZERO main-loss gradient
#      (it stayed uniform 0.5/0.5 -> experts never specialized). Soft blend makes routing DIFFERENTIABLE
#      so the distillation loss can drive per-domain specialization (cost: 2x student forward).
#   4. d_k loss = MSE(v) on ALL timesteps (xopd_dk_space: v; no xopd_train_steps/num_xopd_steps).
#   5. MIXED data: source_ratio 1:1 over {geneval_enhanced, ocr} with unique_sample_num_per_epoch=256
#      -> 128 prompts/domain/epoch (SAME per-domain exposure as each specialist run and the plain
#      geneval_enh_ocr_mixed run, so the MoF is directly comparable). This is the setup that lets the
#      global router specialize the 2 experts per domain.
#   6. Activation checkpointing done FSDP-side (fsdp_activation_checkpointing: true), model-side
#      enable_gradient_checkpointing: false (avoid double-wrapping). AC kept ON as a safety margin:
#      dense_exec runs BOTH experts each step, and LoRA does NOT reduce ACTIVATION memory (grad flows
#      through the frozen base to the adapter inputs), so AC caps the activation peak next to the 64GB
#      replicated teacher.

# ===== Environment =====
launcher: "accelerate"
config_file: config/accelerate_configs/fsdp_hybrid_shard.yaml  # FSDP HYBRID_SHARD student; teacher replicated (loaded separately)
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

# ===== Data (MIXED: geneval_enhanced + ocr; basename = source name for source_ratio) =====
data:
  dataset_dir: "dataset/geneval_enhanced" # eval/test fallback
  # Each directory is preprocessed independently (teacher text embeds precomputed per source); L1
  # sampling block-cycles across them per train.source_ratio. Source names: geneval_enhanced / ocr.
  dataset_dirs:
    - "dataset/geneval_enhanced"
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null
  sampler_type: "auto"

# ===== Model (2-expert velocity MoF; copy-2 from base; per-sample top-1 global router; LoRA rank 64) =====
model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "all-linear"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null
  # --- MoF-V construction (per-SAMPLE top-1 global router; dense_exec for FSDP safety) ---
  mof_enabled: true
  mof_num_experts: 2
  mof_top_k: 1
  mof_route_granularity: "sample"         # per-sample routing (top-1 selection); dense_exec makes execution FSDP-safe
  mof_router_type: "global"               # per-sample gate
  mof_router_input: "prompt"              # route by prompt/domain (drives per-domain expert specialization)
  mof_noise_std: 0.0                      # LoRA gaussian init breaks expert symmetry
  mof_dense_exec: true                    # FSDP-safe: run EVERY expert on ALL samples (uniform all-gather)
  mof_soft_blend: true                    # DIFFERENTIABLE router: blend ALL experts by their gate values (out=sum_e w_e*v_e)
  mof_gate_fn: "sigmoid"                   # INDEPENDENT gates in (0,1); do NOT sum to 1 -> velocity magnitude is free
  mof_topk_sparse: false                   # dense soft blend (NOT sparse top-k)
  mof_router_init: "zero"                  # dense blend keeps BOTH experts active regardless -> zero-init is fine (no dead-expert)
  # --- torch.compile (per-block in-place nn.Module.compile: keeps block class -> FSDP per-block wrap, and state_dict keys -> LoRA save/load unchanged) ---
  compile_teacher: true                   # compile frozen 32B teacher (no-grad/not-saved) -> speed up sampling / teacher-mean precompute
  compile_student: true                   # compile each MoF expert's blocks -> speed up train forward/backward (dense_exec's static expert loop is compile-friendly)
  compile_mode: "default"                 # 'default' (safe); avoid 'reduce-overhead' here (CUDA graphs use MORE memory next to the replicated teacher)

# ===== Logging =====
log:
  run_name: "flux2klein_32b_to_4b_mof2_mix_fsdp_vmse_sigsoft_nolb_1kep"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "/apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints"
  save_freq: 50
  save_model_only: true

# ===== Training (XOPD distill to dev-32B, geneval_enhanced+ocr mix, full-timestep MSE(v)) =====
train:
  trainer_type: "xopd"
  fsdp_shard_teacher: false               # teacher (32B) loaded SEPARATELY + replicated per GPU (NOT in the FSDP bundle); only the student is sharded
  max_epochs: 1000

  teacher_model_name_or_path: "black-forest-labs/FLUX.2-dev"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true
  eval_teacher_at_start: false            # reuse the shared teacher ceiling from the OCR specialist run

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  pathwise_coef: 1.0
  normalize_d_k: false
  kl_type: "x-based"
  kl_beta: 0.0

  # --- L1 loss space: full-trajectory raw-velocity MSE ---
  xopd_dk_space: "v"                       # MSE ||v_s - v_t||^2 on ALL 28 steps (no xopd_train_steps / num_xopd_steps)

  moe_load_balance_coeff: 0.0             # NO load-balance: let the free (non-convex) blend search the best teacher-matching mixture, unforced
  # --- Multi-source sampling ratio (equal 1:1 over geneval_enhanced + ocr) ---
  source_ratio: {geneval_enhanced: 1, ocr: 1}   # period=2 must tile unique_sample_num_per_epoch

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 256        # 1:1 over 2 sources -> 128 prompts/domain/epoch (matches specialists + plain mixed run). num_batches_per_epoch = 256/(32*1) = 8
  gradient_step_per_epoch: 1              # one optimizer step/epoch (auto GAS = num_batches_per_epoch * num_train_timesteps = 8 * 28 = 224)
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: "cuda"

  enable_gradient_checkpointing: false    # model-side AC OFF to avoid double-wrapping; AC is done FSDP-side
                                          # (fsdp_activation_checkpointing: true) as a safety margin (dense_exec runs both experts each step).
  offload_samples_to_cpu: true            # OOM mitigation (2026-07-20): keep the 28-step sampled trajectory on CPU during the train pass -> frees GPU headroom next to the replicated 32B teacher
  seed: 42

# ===== Scheduler =====
scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

# ===== Evaluation (eval @ 512 on all 3 domains) =====
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 40
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval_enhanced,   split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: geneval_gs4,   dataset_dir: dataset/geneval_enhanced,   split: test, guidance_scale: 4.0, eval_reward_names: [geneval, pick_score]}
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}
    - {name: ocr_gs4,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 4.0, eval_reward_names: [ocr, pick_score]}
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore, split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}
    - {name: pickscore_gs4, dataset_dir: dataset/pickscore, split: test, guidance_scale: 4.0, eval_reward_names: [pick_score]}

# ===== Rewards (logging only; not part of the XOPD loss) =====
rewards:
  - {name: "geneval", reward_model: "geneval", weight: 1, batch_size: 64, device: "cuda", dtype: float32, async_reward: false}
  - {name: "pick_score", reward_model: "PickScore", batch_size: 64, device: "cuda", dtype: bfloat16, async_reward: false}
  - {name: "ocr", reward_model: "ocr", batch_size: 64, device: "cpu", dtype: float32, async_reward: false}
