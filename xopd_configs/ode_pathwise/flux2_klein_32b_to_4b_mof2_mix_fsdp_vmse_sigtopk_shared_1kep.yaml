# Cross-OPD (XOPD): FLUX.2-dev (teacher) -> 2-expert VELOCITY-space MoF student, FSDP HYBRID_SHARD,
# MIXED geneval_enhanced + ocr training. MODERN-MoE router: SHARED-LoRA experts + INDEPENDENT SIGMOID
# gating + top-1 SPARSE activation + small-random router init. Design:
#   1. mof_expert_mode: shared_lora -- ONE frozen 4B base + 2 LoRA adapters (expert_0/expert_1),
#      switched per sample. Half the base params of distinct 2x4B (cheaper), experts differ ONLY by LoRA.
#   2. mof_gate_fn: sigmoid -- INDEPENDENT gate sigma(logit_e) in (0,1); gates do NOT sum to 1 (the hard
#      convex constraint is REMOVED). Velocity magnitude is FREE, regularized by MSE(v) ALONE for now
#      (router_z_loss / weight-sum penalty coeffs start at 0; z-loss = logit stabilizer NOT anti-collapse).
#   3. mof_topk_sparse: true -- SELECTIVE activation: every rank loops all adapters (uniform base
#      all-gather -> no NCCL deadlock) but computes only each adapter's routed samples (a 0-routed rank
#      still invokes the base on 1 zero-weight dummy to keep the gather count uniform). sigmoid -> the
#      selected gate value is the blend weight DIRECTLY (differentiable; router trains from the main loss).
#   4. mof_router_init: normal (std 0.02) -- per-expert logits DIFFER at init so top-1 activates BOTH
#      experts from step 0 (dead-expert-at-init prevention; the zero-init head would tie -> collapse to e0).
#   5. Anti-COLLAPSE (one expert taking over DURING training) is NOT engaged (moe_load_balance_coeff: 0);
#      watch per-expert usage and enable the load-balance aux (~0.01) only if it collapses.
#   6. compile_student OFF (torch.compile may not guard on PEFT set_adapter across the adapter switch);
#      compile_teacher stays ON. Everything else (FSDP student + replicated 32B teacher, full-timestep
#      MSE(v), 1:1 geneval+ocr @ 256/epoch, AC FSDP-side) matches the soft run so routing is the variable.

# ===== Environment =====
launcher: "accelerate"
config_file: config/accelerate_configs/fsdp_hybrid_shard.yaml  # FSDP HYBRID_SHARD student; teacher replicated (loaded separately)
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

# ===== Data (MIXED: geneval_enhanced + ocr; basename = source name for source_ratio) =====
data:
  dataset_dir: "dataset/geneval_enhanced" # eval/test fallback
  dataset_dirs:
    - "dataset/geneval_enhanced"
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null
  sampler_type: "auto"

# ===== Model (2-expert velocity MoF; copy-2 from base; per-sample top-1 global router; LoRA rank 64) =====
model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "all-linear"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null
  # --- MoF-V construction (SHARED-LoRA: 1 base + 2 adapters; per-SAMPLE top-1 global router; SIGMOID gate + topk_sparse) ---
  mof_enabled: true
  mof_num_experts: 2
  mof_top_k: 1
  mof_expert_mode: "shared_lora"          # ONE frozen 4B base + 2 LoRA adapters (expert_0/expert_1); experts differ ONLY by LoRA (needs noise_std=0)
  mof_route_granularity: "sample"         # per-sample routing (top-1 selection); required by shared_lora
  mof_router_type: "global"               # per-sample gate
  mof_router_input: "prompt"              # route by prompt/domain (drives per-domain expert specialization)
  mof_router_init: "normal"               # small-Gaussian router head -> per-expert logits DIFFER at init -> top-1 activates BOTH experts (no dead-expert-at-init)
  mof_router_init_std: 0.02
  mof_noise_std: 0.0                      # required by shared_lora (shared frozen base); LoRA lora_B zero-init -> experts identical until routed gradient diverges them
  mof_gate_fn: "sigmoid"                  # INDEPENDENT per-expert gate in (0,1); gates do NOT sum to 1 (free velocity magnitude)
  mof_topk_sparse: true                   # SELECTIVE activation: loop all adapters (uniform base all-gather, FSDP-safe) but compute only routed samples
  mof_dense_exec: true                    # FSDP-safety marker; topk_sparse takes precedence (also uniform)
  mof_soft_blend: false                   # off: sparse top-k instead of dense blend
  # --- torch.compile ---
  compile_teacher: true                   # compile frozen 32B teacher (no-grad/not-saved) -> speed up sampling / teacher-mean precompute
  compile_student: false                  # OFF for shared_lora: torch.compile may not guard on PEFT set_adapter -> stale/ recompiled graph across adapter switches
  compile_mode: "default"

# ===== Logging =====
log:
  run_name: "flux2klein_32b_to_4b_mof2_mix_fsdp_vmse_sigtopk_shared_1kep"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "/apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints"
  save_freq: 50
  save_model_only: true

# ===== Training (XOPD distill to dev-32B, geneval_enhanced+ocr mix, full-timestep MSE(v)) =====
train:
  trainer_type: "xopd"
  fsdp_shard_teacher: false               # teacher (32B) loaded SEPARATELY + replicated per GPU (NOT in the FSDP bundle); only the student is sharded
  max_epochs: 1000

  teacher_model_name_or_path: "black-forest-labs/FLUX.2-dev"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true
  eval_teacher_at_start: false            # reuse the shared teacher ceiling from the OCR specialist run

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  pathwise_coef: 1.0
  reinforce_coef: 0.0
  reinforce_horizon: null
  reinforce_future_reduction: "mean"
  normalize_d_k: false
  kl_type: "x-based"
  kl_beta: 0.0

  # --- L1 loss space: full-trajectory raw-velocity MSE ---
  xopd_dk_space: "v"                       # MSE ||v_s - v_t||^2 on ALL 28 steps (no xopd_train_steps / num_xopd_steps)

  # --- MoF router regularizers (modern-MoE; replace the hard sum-to-1). START ALL AT 0 (velocity-only). ---
  moe_load_balance_coeff: 0.0             # Switch load-balance aux (the ANTI-COLLAPSE tool): code kept, DISABLED. Enable (~0.01) ONLY if experts collapse during training.
  router_z_loss_coeff: 0.0               # ST-MoE z-loss (logit-magnitude stabilizer, NOT anti-collapse): disabled for now.
  mof_weight_sum_penalty_coeff: 0.0       # soft sum-to-1: disabled -> velocity magnitude regularized by MSE(v) alone (free sigmoid gates).
  # --- Multi-source sampling ratio (equal 1:1 over geneval_enhanced + ocr) ---
  source_ratio: {geneval_enhanced: 1, ocr: 1}   # period=2 must tile unique_sample_num_per_epoch

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 256        # 1:1 over 2 sources -> 128 prompts/domain/epoch (matches specialists + plain mixed run). num_batches_per_epoch = 256/(32*1) = 8
  gradient_step_per_epoch: 1              # one optimizer step/epoch (auto GAS = num_batches_per_epoch * num_train_timesteps = 8 * 28 = 224)
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: "cuda"

  enable_gradient_checkpointing: false    # model-side AC OFF to avoid double-wrapping; AC is done FSDP-side
                                          # (fsdp_activation_checkpointing: true) as a safety margin.
  offload_samples_to_cpu: true            # OOM mitigation: keep the 28-step sampled trajectory on CPU during the train pass -> frees GPU headroom next to the replicated 32B teacher
  seed: 42

# ===== Scheduler =====
scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

# ===== Evaluation (eval @ 512 on all 3 domains) =====
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 40
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval_enhanced,   split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: geneval_gs4,   dataset_dir: dataset/geneval_enhanced,   split: test, guidance_scale: 4.0, eval_reward_names: [geneval, pick_score]}
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}
    - {name: ocr_gs4,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 4.0, eval_reward_names: [ocr, pick_score]}
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore, split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}
    - {name: pickscore_gs4, dataset_dir: dataset/pickscore, split: test, guidance_scale: 4.0, eval_reward_names: [pick_score]}

# ===== Rewards (logging only; not part of the XOPD loss) =====
rewards:
  - {name: "geneval", reward_model: "geneval", weight: 1, batch_size: 64, device: "cuda", dtype: float32, async_reward: false}
  - {name: "pick_score", reward_model: "PickScore", batch_size: 64, device: "cuda", dtype: bfloat16, async_reward: false}
  - {name: "ocr", reward_model: "ocr", batch_size: 64, device: "cpu", dtype: float32, async_reward: false}
