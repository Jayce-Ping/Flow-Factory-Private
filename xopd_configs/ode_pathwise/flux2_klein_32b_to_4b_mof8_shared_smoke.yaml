# Cross-OPD (XOPD): FLUX.2-dev (teacher) -> 8-expert VELOCITY-space MoF student (SHARED-BASE).
# expert_mode='shared_lora': ONE frozen FLUX.2-klein-base-4B + 8 LoRA adapters (expert_e = base +
# adapter_e). A shared PER-SAMPLE router picks top-2 experts/sample (softmax + renorm) and blends
# their OUTPUT velocities; distilled to dev-32B (L1 + load-balance aux). Per-sample top-2 runs ONLY
# 2 of 8 expert forwards/sample (the efficient MoF compute path), and holding ONE base (not 8) keeps
# params small. At noise_std=0 this is trainable-equivalent to 8 distinct experts.
#
# SCALE / MEMORY: 1 base (~8GB) + 8 tiny LoRA adapters + 32B teacher (~64GB, replicated) ~72GB/GPU
# -> plain DDP (multi_gpu.yaml); NO FSDP shard / all-to-all / PCIe. LoRA (rank 64, 'all-linear'); the
# router is trained in full. The set_adapter switch loop disables the autocast weight-cache.

# ===== Environment =====
launcher: "accelerate"
config_file: config/accelerate_configs/multi_gpu.yaml   # plain DDP (replicate): shared_lora keeps 1 base (~8GB) + 8 tiny LoRA adapters + teacher(32B,64GB) ~72GB fits 96G. DDP (not FSDP) so per-sample top-k runs only k adapters without an FSDP conditional-all-gather hang. Launch via run_4node_ddp.sh.
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

# ===== Data (OCR-only) =====
data:
  dataset_dir: "dataset/geneval"
  dataset_dirs:
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null
  sampler_type: "auto"

# ===== Model (8-expert velocity MoF; copy-8 from base; per-token top-2; LoRA rank 64 / all-linear) =====
model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "all-linear"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null
  # --- MoF-V construction ---
  mof_enabled: true
  mof_num_experts: 8
  mof_top_k: 2
  mof_route_granularity: "sample"         # per-sample top-2: run ONLY 2 of 8 experts/sample (the efficient MoF path)
  mof_expert_mode: "shared_lora"          # ONE base + 8 LoRA adapters (expert=base+adapter_e); fits 8 experts on DDP
  mof_router_type: "global"               # per-sample gate (sample granularity)
  mof_router_input: "fused_film"          # cheap compromise (prompt backbone + FiLM(t)-modulated latent)
  mof_noise_std: 0.0                      # shared base -> per-expert difference is the LoRA (noise must be 0)

# ===== Logging =====
log:
  run_name: "flux2klein_32b_to_4b_mof8_shared_smoke"
  project: "Flow-Factory-XOPD"
  logging_backend: "none"                 # smoke: no metric backend (console logs still print)
  save_dir: "/root/mof8_smoke_ckpt"       # scratch (tests multi-adapter save/load under DDP)
  save_freq: 2                            # save once mid-smoke -> exercises the shared_lora DDP save
  save_model_only: true

# ===== Training (XOPD distill to dev-32B, OCR-only) =====
train:
  trainer_type: "xopd"
  fsdp_shard_teacher: false               # DDP (not FSDP): 1 base + 8 adapters + teacher all replicated per GPU.
  max_epochs: 3                           # SMOKE: 3 epochs only

  teacher_model_name_or_path: "black-forest-labs/FLUX.2-dev"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true
  eval_teacher_at_start: false

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  pathwise_coef: 1.0
  reinforce_coef: 0.0
  reinforce_horizon: null
  reinforce_future_reduction: "mean"
  normalize_d_k: false
  kl_type: "x-based"
  kl_beta: 0.0

  moe_load_balance_coeff: 0.01            # reused for the MoF router load-balance aux
  source_ratio: {ocr: 1}

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 16         # SMOKE: 2 samples/GPU/epoch for speed
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: "cuda"

  enable_gradient_checkpointing: true     # DDP has no FSDP-side AC -> model-side GC on the (top-k) base+adapter forwards keeps activation ~1x
  offload_samples_to_cpu: false
  seed: 42

# ===== Scheduler =====
scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

# ===== Evaluation (eval @ 512 on all 3 domains) =====
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 999                          # SMOKE: eval off
  seed: 42
  test_sets: []                           # SMOKE: no eval sets (epoch-0 eval would run since 0 % freq == 0); training's own sampling still exercises the shared_lora forward

# ===== Rewards (logging only; not part of the XOPD loss) =====
rewards:
  - {name: "geneval", reward_model: "geneval", weight: 1, batch_size: 64, device: "cuda", dtype: float32, async_reward: false}
  - {name: "pick_score", reward_model: "PickScore", batch_size: 64, device: "cuda", dtype: bfloat16, async_reward: false}
  - {name: "ocr", reward_model: "ocr", batch_size: 64, device: "cpu", dtype: float32, async_reward: false}
