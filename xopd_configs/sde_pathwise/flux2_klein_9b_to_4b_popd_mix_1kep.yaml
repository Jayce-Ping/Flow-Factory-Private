# P-OPD: FLUX.2-klein-base-9B (teacher) -> FLUX.2-klein-base-4B (student), geneval+ocr mixture.
#
# The teacher is matched through a gate rather than unconditionally. For the behavior transition
# y ~ pi_old with shared covariance sigma^2 I,
#
#   log rho = log[ N(y | mu_teacher, sigma^2) / N(y | mu_old, sigma^2) ]
#   gamma   = sigmoid( logit(alpha) + log rho / T )
#   loss    = mean_batch( stop_grad(gamma) * KL_mean(mu_student || mu_teacher) )
#
# so a transition where the teacher is implausible under the student's own transition density
# contributes less. That is the whole point of the method, and it only works if gamma actually
# varies: T sets which regime the gate lives in, and T is NOT a free guess.
#
# alpha and popd_temperature below come from the probe run flux2_klein_9b_to_4b_popd_diag_t1.yaml
# (see scripts/xopd_analysis/calibrate_popd_gate.py). Because log rho ~ N(-K, 2K) exactly under
# the behavior policy, measuring the joint KL K once determines the gate distribution for every
# (alpha, T); T is set to the measured K so the median gate sits mid-range and its spread comes
# from K varying across transitions, and alpha centers that median at 0.5.
#
# Everything else follows the 32B->4B mix baseline (flux2_klein_32b_to_4b_l1_geneval_enh_ocr_mixed
# _vmse_1kep.yaml): same 1:1 domain exposure, same 512px train/eval, same six-test-set eval suite,
# one optimizer step per epoch. It necessarily differs where P-OPD requires it -- a stochastic
# sampler (the density ratio is undefined under ODE), the transition space, and a
# covariance-normalized KL rather than a bare velocity MSE.
launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml  # 9B teacher (~18GB bf16) + 4B LoRA student; ZeRO-2 is the proven multi-node path here
num_processes: 8                          # overridden to 8 * num_machines by the 4-node launcher
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/geneval_enhanced" # eval/test fallback
  dataset_dirs:
    - "dataset/geneval_enhanced"
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null                  # full 33k + 20k prompt pool, as in the 32B->4B mix baseline
  sampler_type: "auto"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "all-linear"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null

log:
  run_name: "flux2klein_9b_to_4b_popd_mix_1kep"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "/apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints"
  save_freq: 50
  save_model_only: true

train:
  trainer_type: "xopd"
  max_epochs: 1000
  fsdp_shard_teacher: false

  # --- Cross-model teacher: same klein family, so VAE *and* text encoder are shared ---
  teacher_model_name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true    # klein 9B/4B share the Qwen3 text encoder, so no separate teacher text embeddings are stored

  eval_teacher_at_start: false

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  # --- Pure L1 on-policy stage (no L0 warmup), as in every 4B distillation run here ---
  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  # --- P-OPD target: responsibility-gated, covariance-normalized transition KL ---
  pathwise_coef: 1.0
  normalize_d_k: true                     # required: the gate multiplies a KL, not a bare MSE
  xopd_dk_space: "xt"                     # required: the density ratio lives on the transition, not on velocity
  xopd_target_mode: "p_opd"
  popd_alpha: 0.731                       # logit(alpha) = K/T = 1, so the median gate sits at 0.5
  popd_temperature: 107.0                 # = measured mean joint KL K (probe w10kj2v8)
  kl_type: "x-based"
  kl_beta: 0.0

  source_ratio: {geneval_enhanced: 1, ocr: 1}   # 1:1, 128 prompts/domain/epoch

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 256        # 8 batches over 32 GPUs; GAS = 8 * num_sde_steps = 32 -> exactly one optimizer step/epoch
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: "cuda"
  enable_gradient_checkpointing: false
  offload_samples_to_cpu: false
  seed: 42

scheduler:
  dynamics_type: "Flow-SDE"               # P-OPD needs a stochastic transition; ODE has no density ratio
  noise_level: 0.7
  num_sde_steps: 4                        # trained transitions per rollout (drawn fresh each epoch)
  sde_steps: null
  seed: 42

# Evaluation is deterministic ODE on all six sets; the gate is a training-only quantity.
# eval_freq 100 also evaluates at epoch 0, which records the undistilled 4B starting point.
# One eval pass over the six sets plus the held-out D_k costs over an hour, which is why it is
# 100 and not the 40 the ODE baselines use; the values remain directly comparable.
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 100
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval_enhanced, split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: geneval_gs4,   dataset_dir: dataset/geneval_enhanced, split: test, guidance_scale: 4.0, eval_reward_names: [geneval, pick_score]}
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,              split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}
    - {name: ocr_gs4,       dataset_dir: dataset/ocr,              split: test, guidance_scale: 4.0, eval_reward_names: [ocr, pick_score]}
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore,        split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}
    - {name: pickscore_gs4, dataset_dir: dataset/pickscore,        split: test, guidance_scale: 4.0, eval_reward_names: [pick_score]}

rewards:
  - name: "geneval"
    reward_model: "geneval"
    weight: 1
    batch_size: 64
    device: "cuda"
    dtype: float32
    async_reward: false
  - name: "pick_score"
    reward_model: "PickScore"
    batch_size: 64
    device: "cuda"
    dtype: bfloat16
    async_reward: false
  # PaddleOCR runs out-of-process on CPU in the isolated `ocr` conda env.
  - name: "ocr"
    reward_model: "ocr"
    batch_size: 64
    device: "cpu"
    dtype: float32
    async_reward: false
