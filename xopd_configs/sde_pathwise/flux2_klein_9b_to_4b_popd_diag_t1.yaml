# P-OPD CALIBRATION PROBE: FLUX.2-klein-base-9B (teacher) -> FLUX.2-klein-base-4B (student)
#
# This config exists to MEASURE, not to train. It is the exact-latent-sum case
# (popd_temperature = 1.0), which the P-OPD note predicts to be the unstable end of the
# temperature axis, and it runs only a handful of epochs.
#
# What it reads off, and why one probe is enough to fix alpha and temperature analytically:
# the observed transition is y ~ N(mu_old, sigma^2 I), so the joint log density ratio is
# exactly Gaussian,
#
#   log rho ~ N(-K, 2K),   K = ||mu_teacher - mu_old||^2 / (2 sigma^2)
#
# and K is logged per sample as popd/teacher_old_kl_joint. The gate is
# gamma = sigmoid(logit(alpha) + log rho / T), so once K and the event dimension D are
# known, gamma's distribution is known for EVERY (alpha, T) without spending another GPU
# hour. T = 1 puts the median gate at sigmoid(logit(alpha) - K); with K >> 1 that is zero to
# machine precision, and the teacher term vanishes even though E[rho] = 1 exactly -- the mean
# is carried by vanishingly rare samples, which is the long tail worth seeing before
# committing a long run.
#
# It doubles as the GPU correctness check for the P-OPD code path. Three logged quantities
# are self-validating:
#   * popd/old_innovation_rms  ~= 1   -- the variance formula matches how y was actually drawn;
#   * popd/behavior_drift_rms  ~= 0   -- replaying the student on the rollout state reproduces
#                                        the rollout mean, i.e. rollout and replay agree;
#   * mean(popd/log_rho_sum)   ~= -mean(popd/teacher_old_kl_joint), the density identity.
# The trainer additionally raises if the replayed covariance or dt disagrees with the rollout.
#
# Everything outside {run_name, max_epochs, eval_freq, save_freq, popd_alpha,
# popd_temperature} is identical to flux2_klein_9b_to_4b_popd_mix_1kep.yaml, so both runs hit
# the same preprocessing cache and the probe's readings transfer to the real run unchanged.

launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml  # 9B teacher (~18GB bf16) + 4B LoRA student; ZeRO-2 is the proven multi-node path here
num_processes: 8                          # overridden to 8 * num_machines by the 4-node launcher
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/geneval_enhanced" # eval/test fallback
  dataset_dirs:
    - "dataset/geneval_enhanced"
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null                  # full 33k + 20k prompt pool, as in the 32B->4B mix baseline
  sampler_type: "auto"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "all-linear"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null

log:
  run_name: "flux2klein_9b_to_4b_popd_DIAG_sum_t1"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "/apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints"
  save_freq: 0                            # probe: nothing here is worth keeping
  save_model_only: true

train:
  trainer_type: "xopd"
  max_epochs: 3                           # enough optimizer steps to see the gate distribution and grad norms
  fsdp_shard_teacher: false

  # --- Cross-model teacher: same klein family, so VAE *and* text encoder are shared ---
  teacher_model_name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true    # klein 9B/4B share the Qwen3 text encoder, so no separate teacher text embeddings are stored

  eval_teacher_at_start: false

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  # --- Pure L1 on-policy stage (no L0 warmup), as in every 4B distillation run here ---
  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  # --- P-OPD target: responsibility-gated, covariance-normalized transition KL ---
  pathwise_coef: 1.0
  normalize_d_k: true                     # required: the gate multiplies a KL, not a bare MSE
  xopd_dk_space: "xt"                     # required: the density ratio lives on the transition, not on velocity
  xopd_target_mode: "p_opd"
  popd_alpha: 0.5                         # neutral prior for the probe; the real run's alpha is set from measured K
  popd_temperature: 1.0                   # EXACT latent sum -- the case under test
  popd_verbose_diagnostics: true          # probe: log every diagnostic; the long runs log only the essential ten
  kl_type: "x-based"
  kl_beta: 0.0

  source_ratio: {geneval_enhanced: 1, ocr: 1}   # 1:1, 128 prompts/domain/epoch

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 256        # 8 batches over 32 GPUs; GAS = 8 * num_sde_steps = 32 -> exactly one optimizer step/epoch
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: "cuda"
  enable_gradient_checkpointing: false
  offload_samples_to_cpu: false
  seed: 42

scheduler:
  dynamics_type: "Flow-SDE"               # P-OPD needs a stochastic transition; ODE has no density ratio
  noise_level: 0.7
  num_sde_steps: 4                        # trained transitions per rollout (drawn fresh each epoch)
  sde_steps: null
  seed: 42

# Evaluation is off for the probe (eval_freq: 0 also skips the epoch-0 eval); the test
# splits are still preprocessed, so the real run inherits a warm cache.
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 0
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval_enhanced, split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: geneval_gs4,   dataset_dir: dataset/geneval_enhanced, split: test, guidance_scale: 4.0, eval_reward_names: [geneval, pick_score]}
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,              split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}
    - {name: ocr_gs4,       dataset_dir: dataset/ocr,              split: test, guidance_scale: 4.0, eval_reward_names: [ocr, pick_score]}
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore,        split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}
    - {name: pickscore_gs4, dataset_dir: dataset/pickscore,        split: test, guidance_scale: 4.0, eval_reward_names: [pick_score]}

rewards:
  - name: "geneval"
    reward_model: "geneval"
    weight: 1
    batch_size: 64
    device: "cuda"
    dtype: float32
    async_reward: false
  - name: "pick_score"
    reward_model: "PickScore"
    batch_size: 64
    device: "cuda"
    dtype: bfloat16
    async_reward: false
  # PaddleOCR runs out-of-process on CPU in the isolated `ocr` conda env.
  - name: "ocr"
    reward_model: "ocr"
    batch_size: 64
    device: "cpu"
    dtype: float32
    async_reward: false
