# CONTROL for the P-OPD 9B -> 4B arm: teacher as the only target, no mixture with the student.
#
# xopd_target_mode: direct removes the responsibility gate and nothing else. Every other field --
# the Flow-SDE sampler and its noise level, the four trained transitions per rollout, the xt loss
# space, the covariance normalization, the 1:1 geneval+ocr mixture, the batch geometry, the
# optimizer and the eval suite -- is identical to
# flux2_klein_9b_to_4b_popd_mix_1kep.yaml. This is what makes the pair interpretable: the gated
# arm differs from the ODE baselines in the sampler, the loss space AND the gate at once, so
# without this control a difference cannot be credited to the gate.
#
# It is also the reference for reading the training loss. Each epoch redraws 4 of 27 transitions
# whose joint KL spans four decades, so train/loss jumps by two orders of magnitude between
# epochs on step selection alone and is not a learning curve in either arm. What IS comparable is
# train/loss/{k} and train/d_k/{k} at a FIXED k, and the held-out eval/{set}/d_k that runs every
# eval; the gate multiplies the loss by gamma, so only the ungated per-step series can be compared
# across the two arms directly.
#
# Equivalently this is the temperature axis taken to its other end: at T = D the responsibility is
# constant at alpha, which is the ungated objective scaled by a factor -- see
# docs/xopd/popd_exact_sum_gate_saturation.tex.
launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml  # 9B teacher (~18GB bf16) + 4B LoRA student; ZeRO-2 is the proven multi-node path here
num_processes: 8                          # overridden to 8 * num_machines by the 4-node launcher
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/geneval_enhanced" # eval/test fallback
  dataset_dirs:
    - "dataset/geneval_enhanced"
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null                  # full 33k + 20k prompt pool, as in the 32B->4B mix baseline
  sampler_type: "auto"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "all-linear"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null

log:
  run_name: "flux2klein_9b_to_4b_direct_ctrl_mix_1kep"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "/apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints"
  save_freq: 50
  save_model_only: true

train:
  trainer_type: "xopd"
  max_epochs: 1000
  fsdp_shard_teacher: false

  # --- Cross-model teacher: same klein family, so VAE *and* text encoder are shared ---
  teacher_model_name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true    # klein 9B/4B share the Qwen3 text encoder, so no separate teacher text embeddings are stored

  eval_teacher_at_start: false

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  # --- Pure L1 on-policy stage (no L0 warmup), as in every 4B distillation run here ---
  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  # --- P-OPD target: responsibility-gated, covariance-normalized transition KL ---
  pathwise_coef: 1.0
  normalize_d_k: true                     # matched to the gated arm: covariance-normalized transition KL
  xopd_dk_space: "xt"                     # matched to the gated arm
  xopd_target_mode: "direct"            # THE ONLY DELTA vs the P-OPD arm
  kl_type: "x-based"
  kl_beta: 0.0

  source_ratio: {geneval_enhanced: 1, ocr: 1}   # 1:1, 128 prompts/domain/epoch

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 256        # 16 batches over 16 GPUs; GAS = 16 * num_sde_steps = 64 -> exactly one optimizer step/epoch
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: "cuda"
  enable_gradient_checkpointing: false
  offload_samples_to_cpu: false
  seed: 42

scheduler:
  dynamics_type: "Flow-SDE"               # matched to the gated arm (a control on ODE would confound the sampler)
  noise_level: 0.7
  num_sde_steps: 4                        # trained transitions per rollout (drawn fresh each epoch)
  sde_steps: null
  seed: 42

# Evaluation is deterministic ODE on all six sets; the gate is a training-only quantity.
# eval_freq 100 also evaluates at epoch 0, which records the undistilled 4B starting point.
# One eval pass over the six sets plus the held-out D_k costs over an hour, which is why it is
# 100 and not the 40 the ODE baselines use; the values remain directly comparable.
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 100
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval_enhanced, split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,              split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore,        split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}

rewards:
  - name: "geneval"
    reward_model: "geneval"
    weight: 1
    batch_size: 64
    device: "cuda"
    dtype: float32
    async_reward: false
  - name: "pick_score"
    reward_model: "PickScore"
    batch_size: 64
    device: "cuda"
    dtype: bfloat16
    async_reward: false
  # PaddleOCR runs out-of-process on CPU in the isolated `ocr` conda env.
  - name: "ocr"
    reward_model: "ocr"
    batch_size: 64
    device: "cpu"
    dtype: float32
    async_reward: false
