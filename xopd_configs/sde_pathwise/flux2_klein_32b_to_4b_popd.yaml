# P-OPD: FLUX.2-dev (teacher) -> FLUX.2-klein-base-4B (student)
# Probability-space proximal teacher on shared-VAE Gaussian SDE transitions.
# This config is the exact latent-sum baseline: popd_temperature=1.0. In high
# latent dimension the responsibility can saturate near zero; use the logged
# event_dim D to compare temperatures sqrt(D) and D (latent-mean surrogate).

launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/geneval_enhanced"
  dataset_dirs:
    - "dataset/ocr"
  preprocessing_batch_size: 32
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: null
  sampler_type: "auto"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "all-linear"
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  model_type: "flux2-klein"
  resume_path: null
  resume_type: null

log:
  run_name: "flux2klein_32b_to_4b_popd_sum_t1"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "/apdcephfs_fsgm3/share_305110755/hunyuan/bowenping/xopd/checkpoints"
  save_freq: 50
  save_model_only: true

train:
  trainer_type: "xopd"
  max_epochs: 1000
  fsdp_shard_teacher: false

  # The teacher transformer uses the student's VAE, latent state and scheduler.
  teacher_model_name_or_path: "black-forest-labs/FLUX.2-dev"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: true
  eval_teacher_at_start: false

  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  # Pure L1 on-policy stage.
  l0_warmup_epochs: 0
  l0_num_inference_steps: 50
  l0_inner_steps: 4
  l0_time_sampling: "logit_normal"
  l0_weighting: "min_snr"
  l0_snr_gamma: 5.0

  # P-OPD requires covariance-normalized transition-mean KL under an SDE.
  pathwise_coef: 1.0
  normalize_d_k: true
  xopd_dk_space: "xt"
  xopd_target_mode: "p_opd"              # Options: direct, p_opd
  popd_alpha: 0.5                         # Teacher prior probability, strictly in (0,1)
  popd_temperature: 1.0                   # 1=exact latent-sum; D=latent-mean surrogate
  kl_type: "x-based"
  kl_beta: 0.0

  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 128
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.0
  ema_update_interval: 4
  ema_device: "cuda"
  enable_gradient_checkpointing: false
  offload_samples_to_cpu: false
  seed: 42

scheduler:
  dynamics_type: "Flow-SDE"              # Options for P-OPD: Flow-SDE, Dance-SDE, CPS
  noise_level: 0.7                        # Must be >0 so transition density is defined
  num_sde_steps: 4                        # Random noisy transitions per rollout
  sde_steps: null                         # null = any denoising step except the final one
  seed: 42

# Evaluation remains deterministic ODE; responsibility is a training-only metric.
eval:
  resolution: 512
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 40
  seed: 42
  test_sets:
    - {name: geneval_gs1, dataset_dir: dataset/geneval_enhanced, split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: geneval_gs4, dataset_dir: dataset/geneval_enhanced, split: test, guidance_scale: 4.0, eval_reward_names: [geneval, pick_score]}
    - {name: ocr_gs1, dataset_dir: dataset/ocr, split: test, guidance_scale: 1.0, eval_reward_names: [ocr, pick_score]}
    - {name: ocr_gs4, dataset_dir: dataset/ocr, split: test, guidance_scale: 4.0, eval_reward_names: [ocr, pick_score]}
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore, split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}
    - {name: pickscore_gs4, dataset_dir: dataset/pickscore, split: test, guidance_scale: 4.0, eval_reward_names: [pick_score]}

rewards:
  - name: "geneval"
    reward_model: "geneval"
    weight: 1
    batch_size: 64
    device: "cuda"
    dtype: float32
    async_reward: false
  - name: "pick_score"
    reward_model: "PickScore"
    batch_size: 64
    device: "cuda"
    dtype: bfloat16
    async_reward: false
  - name: "ocr"
    reward_model: "ocr"
    batch_size: 64
    device: "cpu"
    dtype: float32
    async_reward: false
