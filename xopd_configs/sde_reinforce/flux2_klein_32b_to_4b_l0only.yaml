# Cross-OPD (XOPD) BASELINE: FLUX.2-dev (teacher) -> FLUX.2-klein-base-4B (student)
# Cross-FAMILY distillation: teacher and student share the VAE / latent space
# (AutoencoderKLFlux2, in_channels=128) but use DIFFERENT text encoders -- dev's
# Mistral3 (dim 15360) vs klein's Qwen3 (dim 7680). Teacher text embeddings are
# precomputed during preprocessing and the 48GB teacher text encoder is offloaded
# before training; the 64GB teacher transformer stays resident.
#
# L0-ONLY ablation: l0_warmup_epochs is set absurdly large (1_000_000) so every
# epoch stays in the L0 velocity-regression stage and L1 on-policy transition
# matching is NEVER reached. Pairs with the pure-L1 baseline (the sibling
# flux2_klein_32b_to_4b_l1.yaml, l0_warmup_epochs=0) to isolate each stage's effect.
# Stop the run via max_epochs or manual interrupt.
#
# SDE + REINFORCE variant (auto-generated mirror of the ode_pathwise sibling):
#   dynamics_type=Flow-SDE, noise_level=0.7, reinforce_coef=1.0. The stochastic
#   transition gives a non-degenerate per-step log_prob, so the REINFORCE
#   trajectory term R_bar * log p_theta(x_{k+1}|x_k) actually contributes
#   (under ODE it is a no-op and XOPDTrainer raises). num_sde_steps/sde_steps=null
#   -> every inference step except the last is a training step.

# ===== Environment =====
launcher: "accelerate"                    # Launcher. Options: accelerate
config_file: config/deepspeed/deepspeed_zero2.yaml  # Distributed config; use zero3 / fsdp if VRAM-limited (9B teacher + 4B student)
num_processes: 8                          # Number of processes (GPUs); overrides the config file
main_process_port: 29500                  # Master process port
mixed_precision: "bf16"                   # Mixed precision. Options: no, fp16, bf16

# ===== Data (prompts only; L0's z0 is teacher-generated) =====
data:
  dataset_dir: "dataset/geneval"          # Eval/test fallback (test split is read from here when eval.test_sets omits a dataset_dir).
  # --- Multi-source training (geneval + ocr + pickscore, equal weights) ---
  # Each directory is preprocessed independently (teacher text embeddings are
  # precomputed per source) and L0 sampling block-cycles across them per
  # train.source_ratio below. The source name is the basename of each directory.
  dataset_dirs:
    - "dataset/geneval"
    - "dataset/ocr"
    - "dataset/pickscore"
  preprocessing_batch_size: 8             # Batch size for offline text encoding
  dataloader_num_workers: 16              # DataLoader worker processes
  force_reprocess: false                  # true: ignore cache and re-preprocess
  cache_dir: "~/.cache/flow_factory/datasets"  # Preprocess cache directory
  max_dataset_size: null                  # Truncate dataset size; null = no limit
  sampler_type: "auto"                    # Sampler. Options: auto, distributed_k_repeat, group_contiguous

# ===== Model (student = the small model being trained) =====
model:
  finetune_type: "lora"                   # Finetune mode. Options: full, lora
  lora_rank: 64                           # LoRA rank (used when finetune_type=lora)
  lora_alpha: 128                         # LoRA alpha
  target_modules: "default"               # LoRA targets. Options: all, default, or a list of module names
  model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"  # Student path (HF repo id or local)
  model_type: "flux2-klein"               # Adapter registry key (fixed for klein)
  resume_path: null                       # Checkpoint/LoRA to resume from; null = none
  resume_type: null                       # Options: lora, full, state; null = auto by finetune_type

# ===== Logging =====
log:
  run_name: "flux2klein_32b_to_4b_l0only_sde_reinforce"  # L0-only (l0_warmup_epochs=1e6) under Flow-SDE. NOTE: REINFORCE is an L1-only term; L0 never reaches it, so reinforce_coef has no effect here (kept for config symmetry).
  project: "Flow-Factory-XOPD"            # Logger project name
  logging_backend: "wandb"                # Options: wandb, swanlab, tensorboard, none
  save_dir: "saves/"                      # Checkpoint / log directory
  save_freq: 0                            # Save every N epochs (0 disables)
  save_model_only: true                   # Save only model weights (not optimizer/scheduler state)

# ===== Training (XOPD) =====
train:
  trainer_type: "xopd"                    # Selects the Cross-OPD trainer (fixed)

  # --- Cross-model teacher ---
  teacher_model_name_or_path: "black-forest-labs/FLUX.2-dev"  # Teacher path; only its transformer (~64GB) is loaded. VAE reused from student; teacher text encoder (Mistral3) is precomputed offline then offloaded (see Flux2KleinAdapter.preprocess_func)
  teacher_param_device: "cuda"            # Teacher transformer device. Options: cuda (only cuda supported today), cpu
  assume_shared_vae_text_encoder: true    # FLUX.2-dev shares the VAE / latent space with klein (in_channels=128); its text encoder differs and is encoded separately. false raises.

  # --- Dual classifier-free guidance (teacher / student independent) ---
  teacher_guidance_scale: 1.0             # Teacher CFG. >1 runs cond+uncond passes (needs negatives); raise to distill guidance
  student_guidance_scale: 1.0             # Student CFG for forward + rollout; synced into base guidance_scale

  # --- L0: velocity-regression warmup (teacher-generated data) ---
  l0_warmup_epochs: 1000000               # L0-ONLY baseline: absurdly large so L1 is never reached (every epoch runs L0)
  l0_num_inference_steps: 50              # Teacher rollout steps when generating z0 targets in L0
  l0_inner_steps: 4                       # Random-t regression sub-steps per generated z0 batch; MUST be a multiple of num_train_timesteps (else auto-rounded up + warned). L0 runs l0_inner_steps/num_train_timesteps optimizer steps/epoch; each z0 reused l0_inner_steps times.
  l0_time_sampling: "logit_normal"        # L0 t sampling. Options: logit_normal, uniform
  l0_weighting: "min_snr"                 # L0 loss weight w(t). Options: min_snr, snr, uniform
  l0_snr_gamma: 5.0                       # Min-SNR-gamma clamp (used when l0_weighting=min_snr)

  # --- L1: on-policy transition matching (UNUSED in this L0-only baseline) ---
  pathwise_coef: 1.0                      # Coefficient on per-step Gaussian KL D_k (mean matching); >= 0
  reinforce_coef: 1.0                     # REINFORCE trajectory-term coefficient (ACTIVE; requires SDE scheduler below). Score-function trajectory gradient weighted by R_bar.
  reinforce_horizon: null                 # Future steps aggregated into R_bar; null = all j > k
  reinforce_future_reduction: "mean"      # R_bar aggregation. Options: sum, mean
  normalize_d_k: false                    # true: divide D_k by 2*sigma_bar^2; false: plain MSE
  kl_type: "x-based"                      # KL anchor type vs base. Options: x-based, v-based
  kl_beta: 0.0                            # KL anchor coefficient; 0 disables

  # --- Multi-source sampling ratio (active; requires data.dataset_dirs) ---
  source_ratio: {geneval: 1, ocr: 1, pickscore: 1}   # Equal block-cycle weights (one G·O·P cycle per period). num_batches_per_epoch must be divisible by sum(values)=3 (see unique_sample_num_per_epoch).

  # --- Sampling / batch ---
  resolution: 512                         # Generation resolution (int or [H, W]); klein native is 1024, lower to save memory
  num_inference_steps: 28                 # L1 student rollout steps (undistilled base models need more steps)
  per_device_batch_size: 1                # Conservative start: the FLUX.2-dev teacher transformer is ~64GB resident, so bs=4 (9B optimum) OOMs even with the 48GB teacher TE offloaded. Re-run a batch search once GPUs are free to raise it.
  group_size: 1                           # Group size (XOPD default 1; only >1 if you add grouped REINFORCE)
  unique_sample_num_per_epoch: 192        # Unique prompts/epoch. =3*64 so num_batches_per_epoch is a multiple of 3 (= source_ratio period): 6 batches/epoch on 32 GPUs (pdbs=1) -> two clean geneval·ocr·pickscore cycles.
  gradient_step_per_epoch: 1              # MUST be 1 for XOPD: L1 does exactly one on-policy optimizer step/epoch (auto GAS = num_batches_per_epoch * num_train_timesteps)
  num_inner_epochs: 1                     # MUST be 1 for XOPD (no rollout reuse); enforced at startup
  gradient_accumulation_steps: auto       # Options: auto (recommended), or exactly num_batches_per_epoch * num_train_timesteps

  # --- Optimizer ---
  learning_rate: 1.0e-4                   # Learning rate
  adam_weight_decay: 1.0e-4               # AdamW weight decay
  adam_betas: [0.9, 0.999]               # AdamW betas
  adam_epsilon: 1.0e-8                   # AdamW epsilon
  max_grad_norm: 1.0                      # Gradient-norm clip threshold

  # --- EMA ---
  ema_decay: 0.9                          # EMA decay (0 disables)
  ema_update_interval: 4                  # EMA update interval (epochs)
  ema_device: "cuda"                      # EMA storage device. Options: cpu, cuda

  # --- Memory / misc ---
  enable_gradient_checkpointing: true     # On: the FLUX.2-dev teacher transformer (~64GB) leaves little headroom; trade compute for memory
  offload_samples_to_cpu: false           # Offload sample tensors to CPU between sample() and optimize() to cut peak VRAM
  seed: 42                                # Random seed

# ===== Scheduler =====
scheduler:
  dynamics_type: "Flow-SDE"          # Stochastic transition: enables the REINFORCE trajectory term (ODE would make log_prob 0 -> XOPDTrainer raises if reinforce_coef>0). Options: Flow-SDE, Dance-SDE, CPS, ODE
  noise_level: 0.7                        # SDE noise level a (>0 injects noise -> non-degenerate log_prob for REINFORCE)
  num_sde_steps: null                     # null -> use the full sde_steps pool (every inference step except the last is a noise-injection / training step)
  sde_steps: null                         # null -> auto = range(num_inference_steps-1), i.e. all steps are SDE/training steps (num_train_timesteps = num_inference_steps-1)
  seed: 42                                # Scheduler seed

# ===== Evaluation =====
eval:
  resolution: 1024                        # Eval resolution
  per_device_batch_size: 1                # Eval batch size
  num_inference_steps: 28                 # Eval steps
  guidance_scale: 1.0                     # Eval CFG (global default; overridden per test_set)
  eval_freq: 20                           # Eval every N epochs (0 disables)
  seed: 42                                # Eval seed
  test_sets:                              # geneval / ocr / pickscore, each at gs=1.0 (no CFG) and gs=4.0 (CFG).
                                          # eval_reward_names selects which reward (from the `rewards` list below) runs per set;
                                          # [] = generate images only, no scoring. wandb keys: eval/{name}/reward_{reward}_mean.
    - {name: geneval_gs1,   dataset_dir: dataset/geneval,   split: test, guidance_scale: 1.0, eval_reward_names: [geneval]}
    - {name: geneval_gs4,   dataset_dir: dataset/geneval,   split: test, guidance_scale: 4.0, eval_reward_names: [geneval]}
    - {name: ocr_gs1,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 1.0, eval_reward_names: []}       # OCR reward deps not staged yet -> images only
    - {name: ocr_gs4,       dataset_dir: dataset/ocr,       split: test, guidance_scale: 4.0, eval_reward_names: []}       # OCR reward deps not staged yet -> images only
    - {name: pickscore_gs1, dataset_dir: dataset/pickscore, split: test, guidance_scale: 1.0, eval_reward_names: [pick_score]}
    - {name: pickscore_gs4, dataset_dir: dataset/pickscore, split: test, guidance_scale: 4.0, eval_reward_names: [pick_score]}

# ===== Rewards (optional for XOPD; logging only, NOT part of the distillation loss) =====
# These also serve as the EVAL rewards (no separate `eval_rewards` block -> eval falls back
# to this list, indexed by `name`). eval.test_sets[*].eval_reward_names reference these names.
# GenEval deps (mmcv 2.1.0 + mmdet 3.3.0 + open_clip) installed on all nodes via
# Flow-Factory/scripts/install_geneval_deps.sh; Mask2Former + CLIP ViT-L-14 weights pre-staged.
rewards:
  - name: "geneval"                       # Reward name (referenced by eval_reward_names: [geneval])
    reward_model: "geneval"               # Reward model type (matches dataset/geneval)
    weight: 1                             # Weight (for multi-reward aggregation)
    batch_size: 64                        # Reward inference batch size
    device: "cuda"                        # Device
    dtype: float32                        # GenEval forces fp32 internally (autocast off + model.float()); this is a placeholder
    async_reward: false                   # Compute reward synchronously
  - name: "pick_score"                    # Referenced by eval_reward_names: [pick_score]
    reward_model: "PickScore"
    batch_size: 64
    device: "cuda"
    dtype: bfloat16
    async_reward: false
  # OCR reward: enable once OCR deps (e.g. PaddleOCR) are staged on all nodes, then set the
  # ocr_gs1/ocr_gs4 test sets' eval_reward_names to [ocr].
  # - name: "ocr"
  #   reward_model: "ocr"
  #   batch_size: 64
  #   device: "cuda"
  #   dtype: bfloat16
  #   async_reward: false
