# Cross-VAE XOPD: FLUX.2-klein-base-9B (teacher) -> SD3.5-medium (student)
# PIXEL-BRIDGE-TRANSPORT ablation (user-directed 2026-07-01):
#   The "pixel" transport IS the exact decode-reencode map (T = encode_S . decode_T): teacher
#   mean -> teacher image -> student latent, per step, in the NORMAL latent-space L1. This is
#   the old M1 pixel-bridge-as-transport. It is remembered to COLLAPSE over the FULL trajectory
#   but was NEVER tested restricted to the LATE / low-noise window. This run ablates exactly
#   that: same late window [20..27] as the HSCT runs, latent-space L1 (NOT pixel-space loss).
#   No cold-start (the pixel bridge needs no training; requires_warmup=False).

# ===== Environment =====
launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

# ===== Data (prompts only) =====
data:
  dataset_dir: "dataset/geneval"
  dataset_dirs:
    - "dataset/geneval"
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: 2000
  sampler_type: "auto"

# ===== Model (student = SD3.5-medium) =====
model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "stabilityai/stable-diffusion-3.5-medium"
  model_type: "sd3-5"
  resume_path: null
  resume_type: null

# ===== Logging =====
log:
  run_name: "flux2klein_9b_to_sd35_l1_pixbridge_late"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 0
  save_model_only: true

# ===== Training (XOPD cross-VAE) =====
train:
  trainer_type: "xopd"
  eval_teacher_at_start: false
  max_epochs: 201

  # --- Cross-VAE teacher (independent adapter; 9B teacher shares the 4B VAE) ---
  teacher_model_type: "flux2-klein"
  teacher_model_name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: false

  # --- Pixel-bridge transport: exact decode-reencode, NO training/cold-start ---
  vae_transport: "pixel"
  transport_warmup_batches: 1

  # --- Dual classifier-free guidance ---
  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  # --- L0 disabled (pure L1) ---
  l0_warmup_epochs: 0

  # --- L1: on-policy transition matching (pathwise only), LATENT-space L1 ---
  pathwise_coef: 1.0
  normalize_d_k: false
  kl_type: "x-based"
  kl_beta: 0.0
  # xopd_pixel_loss stays FALSE here: this ablates the pixel-bridge TRANSPORT under the
  # normal latent-space L1 (not the decode-space loss).

  # --- L1 timestep selection: LATE / low-sigma window only (sigma ~ [0.04, 0.29]) ---
  xopd_train_steps: [20, 21, 22, 23, 24, 25, 26, 27]
  num_xopd_steps: 1

  # --- Sampling / batch: 128 unique samples / grad step ---
  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 128
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  # --- Optimizer ---
  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # --- EMA ---
  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"

  # --- Memory / misc ---
  enable_gradient_checkpointing: true
  offload_samples_to_cpu: false
  seed: 42

# ===== Scheduler =====
scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

# ===== Evaluation (geneval + pickscore at gs 1.0 and 4.5) =====
eval:
  resolution: 1024
  per_device_batch_size: 1
  num_inference_steps: 28
  guidance_scale: 1.0
  eval_freq: 25
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval, split: test, guidance_scale: 1.0, eval_reward_names: [geneval, pick_score]}
    - {name: geneval_gs45,  dataset_dir: dataset/geneval, split: test, guidance_scale: 4.5, eval_reward_names: [geneval, pick_score]}

# ===== Rewards =====
rewards:
  - name: "geneval"
    reward_model: "geneval"
    weight: 1
    batch_size: 64
    device: "cuda"
    dtype: float32
    async_reward: false
  - name: "pick_score"
    reward_model: "PickScore"
    batch_size: 64
    device: "cuda"
    dtype: bfloat16
    async_reward: false
