# Cross-VAE XOPD: FLUX.2-klein-base-4B (teacher) -> SD3.5-medium (student)
# Transport-scan variant (4B teacher = faster rollout than 9B; SHARES the 9B VAE so the
# transport problem is IDENTICAL). Pure L1 (l0_warmup_epochs=0), ODE/pathwise only.
#
# Transport: STRICTLY-LINEAR conv (learned PixelShuffle upsample + conv residual on the
# frozen closed-form base affine + paired linear inverse). CLEAN-FIT ONLY: the warm-up
# fits on clean (sigma~0) pairs only (the noisy pixel-bridge target is garbage); by
# Prop.(affine pushforward) a linear/conv transport fit on clean pairs transports EVERY
# noise level correctly, and the L1 transition-mean pushforward stays EXACT.

# ===== Environment =====
launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

# ===== Data (prompts only; L1 is on-policy) =====
data:
  dataset_dir: "dataset/geneval"
  dataset_dirs:
    - "dataset/geneval"
  preprocessing_batch_size: 8
  dataloader_num_workers: 8
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: 2000
  sampler_type: "auto"

# ===== Model (student = SD3.5-medium) =====
model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "stabilityai/stable-diffusion-3.5-medium"
  model_type: "sd3-5"
  resume_path: null
  resume_type: null

# ===== Logging =====
log:
  run_name: "xv_m5_dense"
  project: "Flow-Factory-XOPD"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 0
  save_model_only: true

# ===== Training (XOPD cross-VAE) =====
train:
  trainer_type: "xopd"
  eval_teacher_at_start: false
  max_epochs: 300                          # long horizon: keep cluster busy + reveal the L1 trend

  # --- Cross-VAE teacher (independent adapter) ---
  teacher_model_type: "flux2-klein"
  teacher_model_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  teacher_param_device: "cuda"
  assume_shared_vae_text_encoder: false

  # --- VAE latent-space transport (cross-VAE) ---
  vae_transport: "m5"                      # NON-LINEAR conv + learned inverse + cycle (M5): higher clean fidelity, APPROXIMATE L1 pushforward
  transport_clean_fit_only: true           # fit on CLEAN pairs only (drop garbage noisy pixel-bridge targets)
  transport_warmup_trajectory: false       # clean endpoint only (no wasted per-step decode); clean-fit drops noisy anyway
  transport_warmup_batches: 12             # v2: MORE fresh clean pairs/epoch (was 6) -> SGD-like, less overfit
  transport_warmup_epochs: 40              # online warm-up epochs (fresh clean pairs each)
  transport_base_warmup_epochs: 5          # phase 1: closed-form base affine only; then train the NON-LINEAR residual + inverse on frozen base
  transport_inner_steps: 6                 # v2: FEWER steps/epoch (was 50) on fresh data -> minibatch SGD, generalizes (50 overfit the small pool)
  transport_lr: 1.0e-3

  # --- Dual classifier-free guidance ---
  teacher_guidance_scale: 1.0
  student_guidance_scale: 1.0

  # --- L0 disabled (pure L1) ---
  l0_warmup_epochs: 0

  # --- L1: on-policy transition matching (pathwise only, ODE) ---
  pathwise_coef: 1.0
  normalize_d_k: false
  kl_type: "x-based"
  kl_beta: 0.0

  # --- L1 training-timestep selection: later (lower-noise) half, 1 random step/epoch ---
  xopd_train_steps: null                   # DENSE: all 28 timesteps (was [14..27])
  num_xopd_steps: null                      # DENSE: no per-epoch subsample -> ALL steps each optimizer step (was 1); matches same-VAE baseline's dense gradient

  # --- Sampling / batch ---
  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 16          # lower (2/GPU) since dense uses GAS=2*28=56 micro-steps/epoch
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  # --- Optimizer ---
  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # --- EMA ---
  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"

  # --- Memory / misc ---
  enable_gradient_checkpointing: true
  offload_samples_to_cpu: false
  seed: 42

# ===== Scheduler =====
scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

# ===== Evaluation =====
eval:
  resolution: 1024
  per_device_batch_size: 1
  num_inference_steps: 28
  guidance_scale: 1.0
  eval_freq: 20
  seed: 42
  test_sets:
    - {name: geneval_gs1,   dataset_dir: dataset/geneval,   split: test, guidance_scale: 1.0, eval_reward_names: [geneval]}
    - {name: geneval_gs4,   dataset_dir: dataset/geneval,   split: test, guidance_scale: 4.0, eval_reward_names: [geneval]}

# ===== Rewards (logging only) =====
rewards:
  - name: "geneval"
    reward_model: "geneval"
    weight: 1
    batch_size: 64
    device: "cuda"
    dtype: float32
    async_reward: false
