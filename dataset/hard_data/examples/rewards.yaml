# Evaluation/reward snippets for hard-data records.

# T2I dependency-aware faithfulness. Requires metadata.constraints in JSONL.
dependency_checklist:
  name: dependency_checklist
  reward_model: dependency_checklist
  batch_size: 8
  device: cuda
  dtype: bfloat16
  async_reward: true
  num_workers: 2
  api_base_url: "http://28.7.185.156:8000/v1"
  api_key: "EMPTY"
  vlm_model: "qwen3-vl-235b-a22b-instruct"
  max_concurrent: 16
  max_retries: 3
  timeout: 300

# Multi-reference tail fidelity. The returned reward defaults to p10 rather
# than mean, so copying one reference cannot hide another ignored reference.
multiref_fidelity:
  name: multiref_fidelity
  reward_model: multiref_fidelity
  batch_size: 8
  device: cuda
  dtype: bfloat16
  model_name_or_path: "openai/clip-vit-large-patch14"
  aggregation: p10
  coverage_threshold: 0.25

# Existing edit metric: VIEScore Overall = sqrt(SC * PQ), native 0-10.
geditbench:
  name: geditbench
  reward_model: geditbench
  batch_size: 8
  device: cuda
  dtype: bfloat16
  async_reward: true
  num_workers: 4
  api_base_url: "http://28.7.185.156:8000/v1"
  api_key: "EMPTY"
  vlm_model: "qwen3-vl-235b-a22b-instruct"
  metric: overall
  normalize: false
