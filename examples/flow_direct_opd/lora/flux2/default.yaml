# Weak-to-strong Flow Direct-OPD:
# FLUX.2-klein-base-9B (base + Flow-DPPO RL LoRA) -> FLUX.2-dev recipient.
# Intended starting point: 8x80GB GPUs plus sufficient host RAM for sequential model loading.
# Run scripts/fdopd_analysis/validate_flux2_compatibility.py before launching.

launcher: "accelerate"
config_file: config/accelerate_configs/fsdp2.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/geneval"
  preprocessing_batch_size: 1  # Mistral3 recipient TE and Qwen3 donor TE coexist here.
  dataloader_num_workers: 16
  force_reprocess: true
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: 64
  sampler_type: "auto"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "black-forest-labs/FLUX.2-dev"
  model_type: "flux2"
  resume_path: null
  resume_type: null

log:
  run_name: "fdopd_klein9b_multi_to_flux2dev"
  project: "Flow-Factory-FDOPD"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 10
  save_model_only: true

train:
  trainer_type: "flow-direct-opd"
  max_epochs: 50

  # Frozen donor pair. For the first ablation, replace only donor_rl_lora_path with:
  # Tencent-Hunyuan-Multimodal-RL/FLUX2-klein-base-9b-GenEval2-Single-Reward
  donor_model_type: "flux2-klein"
  donor_base_model_name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"
  donor_rl_lora_path: "Tencent-Hunyuan-Multimodal-RL/FLUX2-klein-base-9b-GenEval2-Multi-Reward"
  donor_vae_name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
  donor_guidance_scale: 1.0
  assume_shared_vae: true

  # No-CFG baseline: match the donor's Flow-DPPO training condition.
  guidance_scale: 1.0
  fdopd_lambda: 0.25
  fdopd_loss_space: "v"  # Options: v, xt. ODE requires v.
  normalize_d_k: false
  fdopd_max_relative_delta_rms: 0.10
  fdopd_trust_kl_per_dim: null
  fdopd_compute_delta_fp32: true
  fdopd_offload_donor_during_rollout: true
  pathwise_coef: 1.0

  # Distill four trajectory quantiles per micro-batch from a full 28-step rollout.
  fdopd_train_steps: null
  num_fdopd_steps: 4
  fdopd_resample_steps_per_batch: true
  fdopd_step_sampling: "stratified"  # Options: uniform, stratified.

  # One optimizer step per fresh recipient rollout.
  resolution: 512
  num_inference_steps: 28
  per_device_batch_size: 1
  group_size: 1
  unique_sample_num_per_epoch: 64
  gradient_step_per_epoch: 1
  num_inner_epochs: 1
  gradient_accumulation_steps: auto

  # LoRA recipient, so the update is a rank-64 adapter rather than 32B of weights. With Adam the
  # per-step parameter movement is set by the learning rate rather than by the loss, and 1e-5 was
  # measured to be too slow to move a recipient at all: on the 4B run it absorbed only ~4% of an
  # 8.4% requested shift in 50 optimizer steps, a 0.4% change in the velocity field, and GenEval did
  # not flip a single decision.
  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # Avoid an additional 32B EMA copy in the initial experiment.
  ema_decay: 0.0
  ema_update_interval: 1
  ema_device: "cpu"
  enable_gradient_checkpointing: false  # FSDP2 config enables activation checkpointing.
  offload_samples_to_cpu: true
  seed: 42

  # Optional extra recipient-to-base anchor. The delta target is already base-anchored.
  kl_type: "v-based"  # Options: v-based, x-based.
  kl_beta: 0.0

scheduler:
  dynamics_type: "ODE"
  noise_level: 0.0
  num_sde_steps: null
  sde_steps: null
  seed: 42

eval:
  resolution: 1024
  per_device_batch_size: 1
  num_inference_steps: 40
  guidance_scale: 1.0
  eval_freq: 5
  seed: 42
  test_sets:
    - name: "geneval_gs1"
      dataset_dir: "dataset/geneval"
      split: "test"
      guidance_scale: 1.0
      eval_reward_names: ["geneval", "pick_score"]

rewards:
  - name: "geneval"
    reward_model: "geneval"
    weight: 1.0
    batch_size: 64
    device: "cuda"
    dtype: float32
    async_reward: false
  - name: "pick_score"
    reward_model: "PickScore"
    weight: 1.0
    batch_size: 64
    device: "cuda"
    dtype: bfloat16
    async_reward: false
