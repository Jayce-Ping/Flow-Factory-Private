# Speed test for E4 Wan2.1-T2V-1.3B GRPO — run in Flow-Factory-Private (full video-training support:
# num_frames, offload_samples_to_cpu). CLIP reward (fast, tf-agnostic) to measure the rollout+train
# cost at the rebuttal-specified generation params. Reduced counts (unique 8 x group 8 = 64 videos).
launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml
num_processes: 8
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/vid_prompt"
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: 64
  sampler_type: "auto"

model:
  finetune_type: 'lora'
  lora_rank: 64
  lora_alpha: 128
  target_components: 'transformer'
  target_modules: "default"
  model_name_or_path: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
  model_type: "wan2_t2v"
  resume_path: null
  resume_type: null

log:
  run_name: "wan_speedtest"
  project: "Flow-Factory"
  logging_backend: "none"
  save_dir: "saves/"
  save_freq: 0
  save_model_only: true

train:
  trainer_type: 'grpo'
  advantage_aggregation: 'gdpo'
  clip_range: 1.0e-4
  adv_clip_range: 5.0
  kl_type: 'v-based'
  kl_beta: 0
  ref_param_device: 'cuda'
  resolution: 512
  num_frames: 21
  num_inference_steps: 14
  guidance_scale: 1.0
  per_device_batch_size: 1
  group_size: 8
  global_std: false
  unique_sample_num_per_epoch: 8
  gradient_step_per_epoch: 2
  gradient_accumulation_steps: auto
  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"
  enable_gradient_checkpointing: false
  offload_samples_to_cpu: true
  max_epochs: 1
  seed: 42

scheduler:
  dynamics_type: "Flow-SDE"
  noise_level: 0.9
  num_sde_steps: 1
  sde_steps: [1, 2, 3]
  seed: 42
  flow_shift: 3.0

eval:
  resolution: 720
  num_frames: 41
  per_device_batch_size: 1
  seed: 42
  guidance_scale: 4.0
  num_inference_steps: 50
  eval_freq: 0

rewards:
  - name: "text_alignment"
    reward_model: "CLIP"
    weight: 1.0
    batch_size: 16
    device: "cuda"
    dtype: bfloat16
