# Critic-based PPO (value net + GAE) for SD3.5 + GenEval.
# v1 runs on DDP (the critic uses a second optimizer; DeepSpeed/FSDP support is a follow-up).

# Environment Configuration
launcher: "accelerate"  # Options: accelerate
config_file: config/accelerate_configs/multi_gpu.yaml  # DDP. PPO v1 requires DDP (no DeepSpeed/FSDP critic yet).
num_processes: 8  # Number of processes to launch (overrides config file)
main_process_port: 29500
mixed_precision: "bf16"  # Options: no, fp16, bf16

# Data Configuration
data:
  datasets:
    - name: default  # Unique identifier (used in metrics, caching, reward routing)
      dataset_dir: "dataset/geneval"  # Folder with train.jsonl / test.jsonl
      train:  # Training participation config
        weight: 1  # Mixing weight (integer); ratio with other sources determines batch allocation
        max_dataset_size: 1024  # Cap on number of training samples for this source
      eval: {}  # Eval participation (inherits shared `eval:` section settings)
  preprocessing_batch_size: 8  # Batch size for preprocessing
  dataloader_num_workers: 16  # Number of workers for DataLoader
  force_reprocess: false  # Force reprocessing of the dataset
  cache_dir: "~/.cache/flow_factory/datasets" # Cache directory for preprocessed datasets
  sampler_type: "auto"  # Options: auto, distributed_k_repeat, group_contiguous

# Model Configuration
model:
  finetune_type: 'lora' # Options: full, lora
  lora_rank : 32
  lora_alpha : 64
  target_modules: "default" # Options: all, default, or list of module names like ["to_k", "to_q", "to_v", "to_out.0"]
  model_name_or_path: "stabilityai/stable-diffusion-3.5-medium"  # HuggingFace model ID or local path
  model_type: "sd3-5"
  resume_path: null # Local path or HF repo id (e.g. 'owner/repo[/subdir][@rev]') for previous checkpoint/lora adapter
  resume_type: null # Options: lora, full, state. Null to auto-detect based on `finetune_type`

log:
  run_name: null  # Run name (auto: {model_type}_{finetune_type}_{trainer_type}_{timestamp})
  project: "Flow-PPO"  # Project name for logging
  logging_backend: "wandb"  # Options: wandb, swanlab, tensorboard, none
  save_dir: "saves/"  # Directory to save model checkpoints and logs
  save_freq: 20  # Save frequency in epochs (0 to disable)
  save_model_only: true  # Save only the model weights (not optimizer, scheduler, etc.)

# Training Configuration
train:
  # Trainer settings
  trainer_type: 'ppo' # Options: 'grpo', 'ppo', 'nft', 'awm'

  # PPO policy clipping
  clip_range: 1.0e-4  # PPO policy ratio clip range (flow log-probs are large; keep tiny)
  adv_clip_range: 5.0  # Per-step advantage clip range
  normalize_advantage: true  # Globally whiten per-step advantages across ranks

  # Critic / value loss
  critic_learning_rate: 1.0e-4  # Learning rate for the value critic (its own optimizer)
  vf_coef: 0.5  # Weight of the value loss in the combined objective
  value_clip_range: 0.2  # PPO value-clip epsilon around old values (null to disable)
  critic_warmup_steps: 30  # Initial critic-only bootstrap (~N critic steps) before the epoch loop

  # Update-frequency decoupling (unit = optimizer rounds; 1 round = gradient_accumulation_steps
  # micro-steps). Both networks forward+backward every micro-step (all data is used); a network
  # with interval N accumulates N*gas micro-steps before each optimizer step. Keep at least one
  # at 1 (the per-round cadence); set the other >1 to make THAT network update less often.
  critic_update_interval: 1  # Step critic every N rounds (>1 => policy relatively faster)
  policy_update_interval: 1  # Step policy every N rounds (>1 => critic relatively faster)

  # Periodic critic re-warmup (resample + critic-only fit, by critic steps) to catch the critic
  # up to the moving policy. critic_warmup_interval <= 0 disables periodic re-warmup.
  critic_warmup_interval: 0  # Periodic re-warmup every N optimizer rounds (<=0 disables)
  critic_rewarmup_steps: 0  # Target critic steps per periodic burst (>=1 required if interval>0)
  update_critic_in_optimize: true  # false => critic frozen in optimize(), trained only by bursts

  # Critic architecture
  critic_type: 'standalone'  # Options: standalone (latent-only value net), backbone (reuse the policy transformer via a separate 'critic' LoRA adapter + value head; lora + DDP only). See backbone_critic.yaml.
  critic_hidden_dim: 512  # Critic hidden width (value head width for both critic types)
  critic_num_layers: 3  # Number of residual MLP blocks in the critic token encoder
  critic_time_embed_dim: 512  # Sinusoidal timestep embedding dim (must be even)
  critic_attn_heads: 8  # Attention-pool heads (must divide critic_hidden_dim)
  critic_num_query_tokens: 1  # Learnable query tokens for attention pooling
  # Backbone critic (critic_type='backbone') only: the 'critic' LoRA adapter on the transformer.
  critic_lora_rank: 32  # LoRA rank for the critic adapter (aligned with policy lora_rank)
  critic_lora_alpha: 64  # LoRA alpha for the critic adapter (aligned with policy lora_alpha)
  # critic_lora_target_modules: null  # null reuses the model's default_target_modules (same as policy)

  # GAE
  gae_gamma: 1.0  # Discount per SDE step (1.0 fits a terminal-only reward)
  gae_lambda: 0.95  # GAE lambda (bias/variance trade-off)

  # Optional KL-to-reference (DPOK-style); 0 disables and saves memory
  kl_type: 'v-based' # Options: 'x-based', 'v-based'
  kl_beta: 0 # KL-vs-reference coefficient. Set ~1e-2 for 'x-based' and ~1e-3 for 'v-based'.
  ref_param_device: 'cuda' # Options: cpu, cuda (full finetune + kl_beta>0 only)

  # Sampling settings
  resolution: 512  # Can be int or [height, width]
  num_inference_steps: 40  # Number of timesteps
  guidance_scale: 1.0  # Guidance scale for sampling (1.0 = CFG-free)

  # Batch and sampling
  per_device_batch_size: 8  # Batch size per device
  group_size: 1  # Trajectories per prompt (1: PPO needs no group; it uses a learned critic baseline, not group normalization)
  unique_sample_num_per_epoch: 128  # Unique prompts per epoch
  gradient_step_per_epoch: 2  # Gradient steps per epoch
  gradient_accumulation_steps: auto  # Options: auto, or positive integer. When set, `gradient_step_per_epoch` is ignored.

  # Optimization (policy)
  learning_rate: 3.0e-4  # Policy (LoRA) learning rate
  adam_weight_decay: 1.0e-4  # AdamW weight decay
  adam_betas: [0.9, 0.999]  # AdamW betas
  adam_epsilon: 1.0e-8  # AdamW epsilon
  max_grad_norm: 1.0  # Max gradient norm for clipping

  # EMA
  ema_decay: 0.99  # EMA decay rate (0 to disable)
  ema_update_interval: 4  # EMA update interval (in epochs)
  ema_device: "cuda"  # Device to store EMA model (options: cpu, cuda)

  # Gradient checkpointing
  enable_gradient_checkpointing: false  # Enable gradient checkpointing to save memory with extra compute

  # Seed
  seed: 42  # Random seed

# Scheduler Configuration
scheduler:
  dynamics_type: "Flow-SDE"  # Options: Flow-SDE, Dance-SDE, CPS, ODE (PPO is coupled -> must be SDE)
  noise_level: 0.7  # Noise level for SDE sampling
  # PPO trains on the full *contiguous* SDE trajectory so the GAE per-step bootstrap is exact.
  # sde_steps null -> [0 .. num_inference_steps-2] (the final deterministic step is excluded);
  # num_sde_steps must equal that count so every SDE step is trained and the GAS multiplier matches.
  num_sde_steps: null  # auto -> num_inference_steps - 1 (full SDE trajectory)
  sde_steps: null  # null -> all denoising steps except the last (contiguous from 0)
  seed: 42  # Scheduler seed (for noise step selection)
  sde_step_selection: "global"  # Options: global (shared SDE steps per batch), per_sample (single-step bandit PPO; see examples/ppo/lora/sd3_5/single_sde.yaml)

# Evaluation settings
eval:
  resolution: 512  # Evaluation resolution
  per_device_batch_size: 8  # Eval batch size
  guidance_scale: 1.0  # Guidance scale for sampling (1.0 = CFG-free)
  num_inference_steps: 40  # Number of eval timesteps
  eval_freq: 20  # Eval frequency in epochs (0 to disable)
  seed: 42  # Eval seed

# Reward Model Configuration
# GenEval: Mask2Former (mmdet 3.x) + CLIP -> continuous reward in [0,1] (object count/color/position).
rewards:
  - name: "geneval"
    reward_model: "geneval"
    batch_size: 16
    device: "cuda"
    dtype: bfloat16

# Optional Evaluation Reward Models, default to all training reward models if not specified
eval_rewards:
  - name: "geneval"
    reward_model: "geneval"
    batch_size: 32
    device: "cuda"
    dtype: bfloat16
