# Explicit Critic Guidance (arXiv:2605.27736) on SD3.5M -- paper-faithful preset.
#
# State-aligned latent actor-critic: the diffusion backbone is its own timestep-conditioned
# value function via critic-attention branches at layers 7/15/23 with AdaLN time modulation
# (critic_type='backbone_branches'), trained with PPO + GAE (gamma=lambda=1), value pretraining,
# global advantage whitening, advantage clip [-10,10], value-TARGET clip [-5,5], CFG-free,
# one sample per prompt. The critic reads the actor backbone's features (no critic LoRA) and is
# bundled into the single prepared root; DDP only.

# Environment Configuration
launcher: "accelerate"  # Options: accelerate
config_file: config/accelerate_configs/multi_gpu.yaml  # DDP. The backbone critic requires DDP (no DeepSpeed/FSDP).
num_processes: 8  # Number of processes to launch (overrides config file)
main_process_port: 29500
mixed_precision: "bf16"  # Options: no, fp16, bf16

# Data Configuration
data:
  datasets:
    - name: default  # Unique identifier (used in metrics, caching, reward routing)
      dataset_dir: "dataset/geneval"  # Folder with train.jsonl / test.jsonl
      train:
        weight: 1
        max_dataset_size: 1024
      eval: {}
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  sampler_type: "auto"  # Options: auto, distributed_k_repeat, group_contiguous

# Model Configuration
model:
  finetune_type: 'lora' # Options: full, lora. (Paper post-trains the full model; LoRA is the practical default. The branch critic works with either since it adds no critic LoRA.)
  lora_rank : 32
  lora_alpha : 64
  target_modules: "default" # Options: all, default, or list of module names
  model_name_or_path: "stabilityai/stable-diffusion-3.5-medium"  # SD3.5M (DiT/MMDiT)
  model_type: "sd3-5"
  resume_path: null
  resume_type: null

log:
  run_name: null
  project: "Flow-PPO"
  logging_backend: "wandb"  # Options: wandb, swanlab, tensorboard, none
  save_dir: "saves/"
  save_freq: 20
  save_model_only: true

# Training Configuration
train:
  # Trainer settings
  trainer_type: 'ppo'

  # PPO policy clipping (paper SD3.5M: ratio clip 1e-4, advantage clip [-10, 10])
  clip_range: 1.0e-4  # PPO policy ratio clip range
  adv_clip_range: 10.0  # Per-step advantage clip range [-10, 10]
  normalize_advantage: true  # Global advantage whitening across ranks

  # Critic / value loss (paper SD3.5M: value LR 1e-3; value-TARGET clip [-5, 5], no PPO value-pred clip)
  critic_learning_rate: 1.0e-3  # Value network learning rate (its own optimizer)
  vf_coef: 0.5  # Weight of the value loss in the combined objective
  value_clip_range: null  # Disable PPO value-prediction clipping (paper clips targets instead)
  value_target_clip_range: 5.0  # Clamp the value-regression TARGETS (returns + old values) to [-5, 5]
  critic_warmup_steps: 15  # Value pretraining: critic-only steps before the epoch loop (paper: ~15 is best)

  # Update frequency (the branch critic shares one DDP root, so critic and policy step together)
  critic_update_interval: 1  # Must equal policy_update_interval for the backbone modes
  policy_update_interval: 1
  critic_warmup_interval: 0  # No periodic re-warmup (paper uses a single value-pretraining stage)
  critic_rewarmup_steps: 0
  update_critic_in_optimize: true  # Joint actor-critic optimization after value pretraining

  # Critic architecture (state-aligned latent critic, arXiv:2605.27736)
  critic_type: 'backbone_branches'  # Critic-attention branches on the shared actor backbone
  critic_tap_layers: [7, 15, 23]  # Transformer block indices feeding the branches (paper default)
  critic_hidden_dim: 512  # Working width of each critic-attention branch (must be divisible by critic_attn_heads)
  critic_attn_heads: 8  # Heads in the branch cross-attention
  critic_time_embed_dim: 512  # Sinusoidal timestep embedding dim for AdaLN (must be even)
  # critic_num_layers / critic_num_query_tokens are unused by backbone_branches (one query token per branch).

  # GAE (paper: gamma = lambda = 1 -> undiscounted Monte-Carlo over short terminal-reward trajectories)
  gae_gamma: 1.0
  gae_lambda: 1.0

  # KL-to-reference: paper discards KL (it only shifts the optimization timescale). Keep disabled.
  kl_type: 'v-based'
  kl_beta: 0
  ref_param_device: 'cuda'

  # Sampling settings (paper SD3.5M: 40 Euler steps, CFG-free)
  resolution: 512
  num_inference_steps: 40  # Number of timesteps
  guidance_scale: 1.0  # CFG-free (1.0); the paper disables classifier-free guidance

  # Batch and sampling (one sample per prompt, like DDPO; increase prompts to match a GRPO group budget)
  per_device_batch_size: 8
  group_size: 1
  unique_sample_num_per_epoch: 128
  gradient_step_per_epoch: 2
  gradient_accumulation_steps: auto

  # Optimization (policy) -- paper: AdamW (0.9, 0.95), wd 1e-4, policy LR 1e-4
  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.95]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # EMA
  ema_decay: 0.99
  ema_update_interval: 4
  ema_device: "cuda"

  # Gradient checkpointing
  enable_gradient_checkpointing: false

  # Seed
  seed: 42

# Scheduler Configuration
scheduler:
  dynamics_type: "Flow-SDE"  # Options: Flow-SDE, Dance-SDE, CPS, ODE (PPO is coupled -> must be SDE)
  noise_level: 0.7  # Noise level for SDE sampling
  # Full *contiguous* SDE trajectory so the GAE per-step bootstrap is exact.
  num_sde_steps: null  # auto -> num_inference_steps - 1 (full SDE trajectory)
  sde_steps: null  # null -> all denoising steps except the last (contiguous from 0)
  seed: 42
  sde_step_selection: "global"  # Options: global, per_sample

# Evaluation settings
eval:
  resolution: 512
  per_device_batch_size: 8
  guidance_scale: 1.0
  num_inference_steps: 40
  eval_freq: 20
  seed: 42

# Reward Model Configuration
# GenEval: Mask2Former (mmdet 3.x) + CLIP -> continuous reward in [0,1] (object count/color/position). (single-reward; swap for HPSv2/CLIP/GenEval/OCR as needed)
rewards:
  - name: "geneval"
    reward_model: "geneval"
    batch_size: 16
    device: "cuda"
    dtype: bfloat16

# Optional Evaluation Reward Models
eval_rewards:
  - name: "geneval"
    reward_model: "geneval"
    batch_size: 32
    device: "cuda"
    dtype: bfloat16
